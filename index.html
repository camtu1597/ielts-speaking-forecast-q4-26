  <div class="ex"><b>Do you often feel bored?</b><br><span style="color:var(--a1)">Not really.</span> <span style="color:var(--a2)">My schedule is packed with school and extra classes.</span> <span style="color:var(--a3)">For instance, I have English classes three evenings a week.</span> <span style="color:var(--a4)">I only get bored on long holidays.</span></div></div>
 <div class="card"><h3>5W2H <span class="vi">– for “when / where / what / have you ever” questions</span></h3>
  <div class="steps">${[["W", "What?", "chuyện gì / vật gì"], ["W", "Who?", "với ai"], ["W", "Where?", "ở đâu"], ["W", "When?", "khi nào"], ["W", "Why?", "tại sao"], ["H", "How?", "như thế nào / cảm thấy ra sao"], ["H", "How much / How long / How often?", "bao nhiêu / bao lâu / bao thường xuyên"]].map((x, k) => `<div><span class="l" style="background:var(${WCOL[k]})">${x[0]}</span><span><b>${x[1]}</b> <span class="vi">(${x[2]})</span></span></div>`).join("")}</div>
  <div class="ex"><b>When was the last time you went to a street market?</b><br>Pick only 3–4 of the W/H questions: <i>When?</i> last weekend · <i>Where?</i> the Old Quarter night market · <i>Who?</i> my friends · <i>What?</i> ate street food · <i>How?</i> crowded but fun.</div></div>
</div>
<div class="fwgrid">
 <div class="card"><h3>Part 2 <span class="vi">– 1 minute to prepare, speak for up to 2 minutes</span></h3>
  <p><b>Time sequence</b> <span class="vi">(trình tự thời gian)</span>: Before → At first → Then → After that → In the end → How I feel now.</p>
  <p><b>Storytelling</b> <span class="vi">(kể chuyện)</span>: Setting (when/where/who) → What happened → The best/worst moment → Ending → Why it matters to me.</p>
  <p><b>5W2H</b>: answer each bullet on the cue card with What / Who / Where / When / Why / How, then add feelings.</p>
  <div class="ex">Notes = keywords only, e.g. <i>last summer · Da Lat · cousins · got lost · kind local · learned …</i></div></div>
 <div class="card"><h3>Part 3 – OREO <span class="vi">– go deeper with a real example</span></h3>
  <div class="steps">${OREO.map(o => `<div><span class="l" style="background:var(${o[3]})">${o[0]}</span><span><b>${o[1]}</b> <span class="vi">(${o[2]})</span></span></div>`).join("")}</div>
  <div class="ex">Make the example specific: <b>who</b> (my aunt, a classmate), <b>where</b> (in Hanoi, at my school), <b>what happened</b>, and <b>a number</b> if possible (“about 30 minutes a day”).</div></div>
</div>
<div class="card"><h3>Quick tips <span class="vi">(Mẹo nhanh)</span></h3><ul style="margin:0;padding-left:20px;display:grid;gap:4px">
 <li>Don’t just say “Yes” or “No” – always add a reason or an example.</li>
 <li>Answer in the right tense: “When was the first time…?” → past simple.</li>
 <li>Use one general phrase + one topic word in every answer.</li>
 <li>Don’t memorise long answers – 2–4 natural sentences is enough.</li></ul></div>`;

/* ================= GENERAL VOCAB ================= */
$("#general").innerHTML = `<div class="card"><div class="thead"><div><span class="tag gen">General vocab</span><h3>Phrases you can use for ANY topic</h3><p class="vi">Cụm từ dùng được cho nhiều chủ đề: sở thích, tần suất, lý do, cảm xúc, so sánh…</p></div><button type="button" class="btn ghost" data-hidevi aria-pressed="false">Hide Vietnamese</button></div>
<div class="gcats">${GENERAL.map(c => `<div class="gcat"><h4>${esc(c.cat)}</h4>${c.items.map(v => `<div class="vc"><b>${esc(v[0])}</b><span class="v">${esc(v[1])}</span><i>${esc(v[2])}</i></div>`).join("")}</div>`).join("")}</div></div>`;

/* ================= QUIZ ================= */
const Q = { list: [], i: 0, score: 0, miss: [], src: store.get("qsrc", "all"), len: +store.get("qlen", 10) };
function pool(src) {
  if (src === "general") return GEN;
  if (src === "topical") return TOPICS.flatMap(t => t.vocab);
  if (src === "part2") return PART2.flatMap(t => t.vocab);
  if (src === "all") return TOPICS.flatMap(t => t.vocab).concat(PART2.flatMap(t => t.vocab), GEN);
  const t2 = PART2.find(x => "p2:" + x.id === src); if (t2) return t2.vocab;
  const t = TOPICS.find(x => x.id === src); return t ? t.vocab : GEN;
}
function gapOf(v) { if (v[0].includes("…")) return null; const re = new RegExp("\\b" + reEsc(v[0]) + "\\b", "i"); return re.test(v[2]) ? v[2].replace(re, "<span class=\"blank\">&nbsp;</span>") : null; }
function makeQuiz(items) {
  const P = pool(Q.src), big = TOPICS.flatMap(t => t.vocab).concat(PART2.flatMap(t => t.vocab), GEN);
  return shuffle(items || P).slice(0, items ? items.length : Q.len).map(v => {
    const others = shuffle((P.length >= 6 ? P : big).filter(x => x[0] !== v[0] && x[1] !== v[1])).slice(0, 3);
    const gap = gapOf(v);
    const kinds = ["mean", "rev"].concat(gap ? ["gap", "gap"] : []);
    const k = kinds[Math.floor(Math.random() * kinds.length)];
    const opts = shuffle([v].concat(others));
    if (k === "mean") return { v, kind: "Choose the Vietnamese meaning", prompt: `<b>${esc(v[0])}</b>`, opts: opts.map(o => o[1]), ans: v[1] };
    if (k === "rev") return { v, kind: "Choose the English phrase", prompt: `“${esc(v[1])}”`, opts: opts.map(o => o[0]), ans: v[0] };
    return { v, kind: "Complete the sentence", prompt: esc(v[2]).replace(new RegExp(reEsc(esc(v[0])), "i"), '<span class="blank">&nbsp;</span>'), opts: opts.map(o => o[0]), ans: v[0] };
  });
}
function quizStart(items) { Q.list = makeQuiz(items); Q.i = 0; Q.score = 0; Q.miss = []; drawQ(); }
function quizHome() {
  $("#quiz").innerHTML = `<div class="qz"><div class="card"><span class="tag">Quiz</span><h3>Review the suggested vocabulary</h3><p class="vi">3 question types: Vietnamese meaning, English phrase, and gap-fill. (Nghĩa tiếng Việt, chọn cụm tiếng Anh, điền vào câu)</p>
  <label class="row"><b>Words from:</b><select id="qsrc"><option value="all">Everything (topics + general)</option><option value="topical">All Part 1 topic vocab</option>${PART2.length ? `<option value="part2">All Part 2 vocab</option>` : ""}<option value="general">General vocab</option>${TOPICS.map(t => `<option value="${t.id}">Part 1: ${esc(t.name)}</option>`).join("")}${PART2.map(t => `<option value="p2:${t.id}">Part 2: ${esc(t.name || t.title)}</option>`).join("")}</select></label>
  <label class="row"><b>Number of questions:</b><select id="qlen">${[10, 20, 30].map(n => `<option ${n === Q.len ? "selected" : ""}>${n}</option>`).join("")}</select></label>
  <div class="row"><button type="button" class="btn" id="qgo">Start quiz ▶</button></div></div></div>`;
  $("#qsrc").value = Q.src; if ($("#qsrc").value !== Q.src) $("#qsrc").value = "all";
  $("#qsrc").onchange = e => { Q.src = e.target.value; store.set("qsrc", Q.src); };
  $("#qlen").onchange = e => { Q.len = +e.target.value; store.set("qlen", Q.len); };
  $("#qgo").onclick = () => quizStart();
}
function drawQ() {
  const q = Q.list[Q.i], n = Q.list.length;
  $("#quiz").innerHTML = `<div class="qz"><div class="card"><div class="row" style="justify-content:space-between"><span class="tag">Question ${Q.i + 1} / ${n}</span><b>Score: ${Q.score}</b></div>
  <div class="qbar"><i style="width:${Q.i / n * 100}%"></i></div><p class="qkind">${q.kind}</p><p class="qprompt">${q.prompt}</p>
  <div class="opts">${q.opts.map((o, k) => `<button type="button" class="opt" data-k="${k}">${"ABCD"[k]}. ${esc(o)}</button>`).join("")}</div>
  <p class="fb" aria-live="polite"></p><div class="row"><button type="button" class="btn" id="qnext" hidden>${Q.i < n - 1 ? "Next ▶" : "See my score"}</button><button type="button" class="btn ghost" id="qquit">Quit</button></div></div></div>`;
  $$(".opt").forEach(b => b.onclick = () => {
    const pick = q.opts[+b.dataset.k], good = pick === q.ans;
    $$(".opt").forEach(x => { x.disabled = true; if (q.opts[+x.dataset.k] === q.ans) x.classList.add("ok"); });
    if (!good) { b.classList.add("bad"); Q.miss.push(q.v); S.bad(); } else { Q.score++; S.ok(); }
    const fb = $(".fb"); fb.className = "fb " + (good ? "ok" : "bad");
    fb.innerHTML = (good ? "♡ Correct! " : "✗ Not quite. ") + `<span style="font-weight:500;color:var(--ink)">${esc(q.v[0])} = ${esc(q.v[1])} · <i>${esc(q.v[2])}</i></span>`;
    $("#qnext").hidden = false; $("#qnext").focus();
  });
  $("#qnext").onclick = () => { Q.i++; Q.i < n ? drawQ() : drawEnd(); };
  $("#qquit").onclick = quizHome;
}
function drawEnd() {
  const n = Q.list.length, pct = Math.round(Q.score / n * 100);
  $("#quiz").innerHTML = `<div class="qz"><div class="card" style="text-align:center">${mini(pct >= 70 ? 1 : 0)}<span class="tag" style="justify-self:center">Result</span><p class="big">${Q.score} / ${n}</p><p>${pct >= 90 ? "Excellent! 🌟" : pct >= 70 ? "Great job! Review the few mistakes below." : pct >= 50 ? "Not bad – try the mistakes again." : "Keep practising – review the topic vocab first."}</p></div>
  ${Q.miss.length ? `<div class="card"><h3>Words to review (${Q.miss.length})</h3><div class="miss">${Q.miss.map(v => `<div><b>${esc(v[0])}</b> – ${esc(v[1])}<br><i class="vi">${esc(v[2])}</i></div>`).join("")}</div></div>` : ""}
  <div class="row" style="justify-content:center">${Q.miss.length ? `<button type="button" class="btn acc" id="qmiss">Retry my mistakes</button>` : ""}<button type="button" class="btn" id="qnew">New quiz</button><button type="button" class="btn ghost" id="qhome">Change settings</button></div></div>`;
  if (Q.miss.length) $("#qmiss").onclick = () => quizStart(Q.miss.slice());
  $("#qnew").onclick = () => quizStart();
  $("#qhome").onclick = quizHome;
  if (pct >= 70) S.end();
}

/* ---------- start ---------- */
renderTopic(); renderP2(); renderP3(); quizHome();
const t0 = store.get("tab", "topics"); if (["topics", "part2", "part3", "how", "general", "quiz"].includes(t0)) showTab(t0);
})();

</script>
