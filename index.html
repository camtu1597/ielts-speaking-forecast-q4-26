  s:"The person I’d like to talk about is my grandfather. He’s seventy-eight and used to be a history teacher. He has lived with my family since I was ten, so we’ve become very close. We do lots of things together. Every morning, we go for a short walk around the lake near our house, and in the evening we usually play chess. He taught me how to play when I was eleven, and for years I never won a single game! He also loves gardening, so at weekends I help him water his plants on the balcony. While we do these things, he often tells me stories about his life, like how he went to school during the war. There are many reasons why I admire him. He’s very wise and calm, and he always gives me good advice when I have problems with friends or exams. What impresses me most is that he’s a lifelong learner. At seventy-eight, he taught himself to use a tablet so he could read the news and video call his old students. Spending quality time with him means a lot to me, and I hope I can be as positive as him when I’m older.",
  p3:[
    { q:"What can young and old people learn from each other?", h:["Old people share experience; young people share technology","Each generation has different strengths","I taught my grandfather to use Zalo, and he taught me how to stay calm in difficult times","Learning from each other reduces the generation gap"],
      s:"Older people can share their life experience and wisdom, while young people can help them with technology and new ideas. For example, I taught my grandfather how to use Zalo, and in return he taught me how to stay calm when I face problems. Learning from each other like this helps reduce the generation gap." },
    { q:"Has old people’s life quality improved when compared to the past?", h:["Yes, in many ways","Better healthcare, more money and technology","My grandparents now have health checks and video call grandchildren abroad","But some feel lonely as families live apart"],
      s:"Yes, I think it has improved a lot, mainly thanks to better healthcare and technology. My grandparents, for instance, now have regular health checks and video call their relatives abroad every week. However, some older people feel lonely because their children move to big cities for work." },
    { q:"Why is there a generation gap between the young and the old?", h:["They grew up in very different worlds","Technology and values have changed quickly","My grandma thinks gaming is a waste of time, while my brother sees it as a career","Talking openly helps"],
      s:"Mainly because they grew up in completely different worlds – technology and values have changed very quickly. For example, my grandmother thinks video games are a total waste of time, while my brother dreams of becoming a professional gamer. Talking openly and listening to each other can help close that gap." },
    { q:"What do old people usually do in their daily life?", h:["Exercise, gardening, looking after grandchildren","They have more free time and want to stay healthy","Every morning the park near my house is full of elderly people doing tai chi","Many also meet friends for tea and chess"],
      s:"Many older people exercise, do gardening or look after their grandchildren, because they have more free time and want to stay healthy. Every morning, the park near my house is full of elderly people doing tai chi or dancing. In the afternoon, many of them meet friends for tea or a game of chess." }

  p3:[

      s:"Many people start their own business because they want to be their own boss and possibly earn more money. They also want the freedom to follow their passion. My friend’s dad, for example, left his factory job to open a café because he loved coffee. Others start a business simply because they can’t find a suitable job." },
    { q:"Should governments provide financial support to start-ups?", h:["Yes, to some extent","Start-ups create jobs and new ideas","Low-interest loans helped young farmers in my hometown start online shops","But support should go to strong, realistic plans"],

      s:"It depends. In big cities, many people prefer big stores because there’s more choice and the prices are clear. But small shops are closer and the owners are friendly. My mum, for instance, does a big shop at the supermarket once a month, but buys fresh vegetables from a small shop near our house every day." },
    { q:"What makes a business successful?", h:["Good products, good service and good marketing","Customers come back if they’re happy","My friend’s dad’s cafés are full because the coffee is good and staff remember customers’ orders","Also adapting to change"],
      s:"I think a business needs good products, good customer service and smart marketing. If customers are happy, they come back and tell their friends. My friend’s dad’s cafés, for example, are always full because the coffee is excellent and the staff remember regular customers’ orders. Being able to adapt to change is also crucial." },
    { q:"What makes a business fail?", h:["Poor planning, bad service or high costs","Many owners don’t study the market","A bubble tea shop near my school closed in 6 months because the rent was too high and there were already 5 similar shops","Not adapting to trends also causes failure"],

{ cat:"person", id:"plants", name:"Loves growing plants", title:"Describe a person who loves to grow plants (e.g. vegetables, flowers) at home or in the garden",

  vocab:[

    ["therapeutic","giúp chữa lành, thư giãn","Gardening is therapeutic for her."]

  s:"The person I want to talk about is my mum, who really has green fingers. A few years ago, she turned the roof of our house in Hanoi into a small rooftop garden. She grows all kinds of plants there. There are herbs like basil and mint, vegetables such as morning glory and lettuce, and some tomato plants. She also has a few orchids, which are her pride and joy. She grows them in a very eco-friendly way. She uses old plastic bottles and broken buckets as pots, and she makes her own compost from kitchen waste, so her vegetables are completely chemical-free. She waters the plants every morning before work, and on Sundays I help her pull out weeds and harvest the vegetables. There are a few reasons why she loves growing plants. First, she worries about pesticides in market vegetables, so she wants our family to eat safe food. Second, gardening is therapeutic for her – after a stressful day at work, she spends half an hour in the garden and feels relaxed. It also saves us a bit of money. I’m really proud of her, and our meals taste better because of her garden.",
  p3:[
    { q:"What are the advantages of growing vegetables or flowers at home?", h:["Safe food, relaxation and saving money","You know exactly what goes into your food","My mum’s chemical-free vegetables and herbs save us money every week","Plants also make homes greener and cooler"],
      s:"There are several advantages. First, home-grown vegetables are safer because you know exactly what goes into them. Second, gardening is very relaxing. My mum, for example, grows chemical-free herbs and vegetables that save us money every week and help her unwind after work. Plants also make a home greener and cooler." },
    { q:"Do many people grow vegetables or flowers at home in your country?", h:["Yes, quite a lot","People worry about food safety and love plants","In my neighbourhood, many rooftops and balconies are full of pots","In the countryside almost every house has a garden"],
      s:"Yes, quite a lot, especially since people have become worried about food safety. In my neighbourhood in Hanoi, many rooftops and balconies are full of pots of herbs and vegetables. In the countryside, almost every house has a vegetable garden, and people grow flowers to sell or decorate for Tết." },
    { q:"Is it easy to grow plants at home?", h:["Easy for some plants, hard for others","It depends on space, sunlight and time","Herbs grew easily for me, but my tomatoes died because I forgot to water them","Beginners should start with easy plants"],
      s:"It depends on the plant. Some, like herbs or morning glory, are very easy, but others need lots of sunlight, space and care. I tried to grow tomatoes last year, but they died because I forgot to water them during exam week, while my mint plant grew without any problem. Beginners should start with simple plants." },
    { q:"Why do some people like to grow plants?", h:["It’s relaxing and rewarding","Watching something grow gives a sense of achievement","My grandfather says looking after his bonsai calms his mind","Some also love nature or need safe food"],
      s:"Many people grow plants because it’s relaxing and rewarding – watching something grow gives you a sense of achievement. My grandfather, for instance, spends hours looking after his bonsai trees, and he says it calms his mind. Others simply love nature or want safe food for their families." },
    { q:"Why do some people prefer to grow their own fruits and vegetables instead of buying them from the market?", h:["Food safety and freshness","They worry about pesticides","There were news reports about chemicals in vegetables, so my aunt started her own garden","It’s also fresher and cheaper"],

{ cat:"person", id:"medical", name:"Wants a medical career", title:"Describe a person you know who would like to choose a career in the medical field (e.g. a doctor, a nurse)",

  vocab:[

    ["paediatrician","bác sĩ nhi khoa","She hopes to become a paediatrician."],
    ["medical school","trường y","Getting into medical school is very competitive."],
    ["save lives","cứu người","Doctors save lives every day."],
    ["make a difference","tạo ra sự khác biệt","She wants to make a difference in people’s lives."],
    ["demanding","đòi hỏi cao, vất vả","Medicine is a very demanding career."],

  ],
  s:"I’d like to talk about my classmate Ha, who dreams of working in the medical field. We’ve known each other since grade six, when we sat next to each other on the first day of secondary school. Ha started thinking about becoming a doctor when she was about twelve. At that time, her grandmother was very ill and spent a month in hospital. Ha visited her almost every day, and she was really impressed by how compassionate the doctors and nurses were. They not only treated her grandmother but also comforted the whole family. Since then, she has worked incredibly hard. She’s one of the best students in biology and chemistry in our school, and at weekends she volunteers at a local health centre, helping nurses with simple tasks. Her goal is to get into medical school and become a paediatrician, a doctor for children, because she loves kids. She says she wants to make a difference in people’s lives, just like the doctors who saved her grandmother. I know medicine is a very demanding career, with long years of study and stressful work, but I really admire her determination. I’m sure she’ll be a great doctor.",
  p3:[
    { q:"Do you think being a doctor is easy or difficult?", h:["Very difficult","Long training, long hours and huge responsibility","My uncle, a surgeon, studied for 9 years and sometimes works 24-hour shifts","But it’s also very rewarding"],
      s:"I think it’s extremely difficult. Doctors need many years of training, they work long hours and they carry huge responsibility for people’s lives. My uncle, for instance, is a surgeon – he studied for nine years and sometimes works twenty-four-hour shifts. However, he says it’s also the most rewarding job in the world." },

{ cat:"person", id:"languages", name:"Good at languages", title:"Describe a person who is good at learning and speaking new languages",

  vocab:[

    ["language exchange","trao đổi ngôn ngữ","He uses a language exchange app."],
    ["pick up","học lỏm, học được","He picked up some Japanese from anime."],
    ["native speaker","người bản ngữ","He chats with native speakers online."],

  s:"The person I’d like to talk about is my cousin Nam, who’s twenty-two. Since he’s part of my family, I’ve known him all my life, but we became closer when he started helping me with my English homework a few years ago. Nam really has a knack for languages. Apart from Vietnamese, he’s fluent in English, he can speak Korean quite well, and he has picked up some Japanese from watching anime. What’s interesting is how he learns. He never just studies from textbooks; instead, he immerses himself in the language. He watches films with subtitles, listens to podcasts while cycling to university and uses language exchange apps to chat with native speakers. He also writes ten new words in a small notebook every day and tries to use them in conversation. For example, he taught himself Korean in about two years and even won a scholarship to study in Seoul for a semester. I feel really impressed by him and also a bit jealous! But mostly, he motivates me. Thanks to his tips, I now watch English videos every day, and my listening has improved a lot.",
  p3:[
    { q:"Are there many people who can speak foreign languages in your country?", h:["More and more, especially young people","English is taught from primary school and needed for jobs","Most of my classmates can hold a basic conversation in English","In rural areas, it’s still less common"],
      s:"Yes, more and more, especially among young people in big cities, because English is now taught from primary school and is important for jobs. Most of my classmates, for example, can hold a basic conversation in English, and some also learn Korean or Japanese. In rural areas, though, it’s still less common." },
    { q:"Does speaking other languages help at work?", h:["Yes, a lot","More job opportunities and higher salaries","My cousin got a job at a Korean company because he speaks Korean","It also helps communicate with foreign partners"],

      s:"Yes, Korean, Japanese and Chinese are becoming very popular in Vietnam, partly because many companies from those countries invest here. Culture also plays a role – many of my friends learn Korean because they love K-pop and K-dramas. Still, English remains the most widely studied foreign language." },
    { q:"Why is it easier for children to learn new things than for adults?", h:["Their brains are flexible and they aren’t afraid of mistakes","Children are curious and have more time","My 6-year-old cousin picked up English songs faster than her parents","Adults have more pressure and less time"],
      s:"Children’s brains are more flexible, and they aren’t afraid of making mistakes, so they learn faster. They’re also curious and have more free time. My six-year-old cousin, for example, picked up English songs from YouTube much faster than her parents did. Adults, on the other hand, have jobs, families and less time to practise." },
    { q:"How do people learn new things?", h:["Through classes, online videos and practice","People now have many options thanks to the internet","My dad learned to fix his motorbike by watching YouTube","Learning by doing is the most effective"],

{ cat:"person", id:"company", name:"Works in a successful company", title:"Describe a person who works in a successful company",

  outline:[["Who","my uncle Hung, 35"],["What he does","marketing manager, plans online campaigns, leads a team of 8"],["The company","a big Vietnamese dairy company"],["Example","his team made a viral Tết ad"],["Why successful","quality products, cares about customers and staff, exports abroad"]],
  vocab:[

  s:"I’d like to talk about my uncle Hung, who’s thirty-five and works for one of the biggest dairy companies in Vietnam. He’s the marketing manager there, so he leads a team of eight people. His job is to plan marketing campaigns, especially online ones, and to find out what customers want. Last year, his team made a short Tết advertisement about a grandmother waiting for her grandchildren, and it went viral on social media with millions of views. The company produces milk, yoghurt and other dairy products, and it’s been the market leader in Vietnam for many years. I think it’s successful for several reasons. First, its products are high quality and sold at reasonable prices, so almost every family buys them. Second, it really cares about customer satisfaction – my uncle says they read customer feedback every week. Third, the company treats its staff well, with good salaries and employee benefits, so people like my uncle stay for a long time. Finally, it exports to many countries, which has given it a great international reputation. I’m quite proud that a Vietnamese company is so successful.",
  p3:[
    { q:"Do you think governments should provide financial support to companies?", h:["Yes, in difficult times or for small firms","They protect jobs and the economy","During the pandemic, tax cuts helped many small restaurants survive","But big, rich companies shouldn’t get too much"],
      s:"Yes, but mainly in difficult times or for small companies, because they protect jobs and the economy. During the pandemic, for example, tax reductions helped many small restaurants in my area stay open. However, I don’t think large, profitable companies need government money." },
    { q:"Do you think companies should donate money to help society?", h:["Yes, especially big companies","They make money from society, so they should give back","Some companies built schools in mountain areas after floods","It also improves their reputation"],
      s:"Yes, especially big companies, because they make their profits from society, so they should give something back. After the floods in central Vietnam, for example, several companies donated money to rebuild schools. It’s good for society, and it also improves the company’s reputation." },
    { q:"Do you think customer satisfaction is important for a company?", h:["Yes, extremely important","Happy customers return and recommend the company","A restaurant near me lost customers after bad reviews on Google","Reviews online spread very fast"],

  ]},
{ cat:"person", id:"childfriend", name:"Childhood friend", title:"Describe a friend from your childhood",
  bullets:["who he/she is","where and how you met each other","what you often did together"], ending:"and explain what made you like him/her.",
  f:"T", link:"",
  outline:[["Who","Tuan, my neighbour"],["How you met","age 5, his family moved next door; he shared his toys"],["Childhood","played football in the alley, flew kites, rode bikes, did homework together"],["Later","he moved to Da Nang when we were 12"],["Now","still keep in touch online, meet in summer"],["Why I liked him","generous, funny, always stood up for me"]],
  vocab:[
    ["childhood friend","bạn thời thơ ấu","Tuan is my childhood friend."],
    ["next-door neighbour","hàng xóm sát vách","He was my next-door neighbour."],
    ["get along well","hợp nhau","We got along well from the start."],
    ["inseparable","không thể tách rời","We were inseparable as kids."],
    ["stand up for","bênh vực","He always stood up for me."],
    ["generous","hào phóng","He was generous and shared everything."],
    ["lose touch","mất liên lạc","We almost lost touch after he moved."],
    ["fond memories","kỷ niệm đẹp","I have fond memories of those days."]
  ],
  s:"I’d like to talk about Tuan, my best friend when I was a child. We met when I was about five, because his family moved into the house next door. On the first day, he came over and shared his toy cars with me, and we got along well from the start. For the next seven years, we were inseparable. After school, we played football in the narrow alley in front of our houses, and in summer we flew kites on the dyke near our neighbourhood. We also rode our bikes around the area and often did our homework together, although we mostly chatted instead of studying! When we were twelve, his dad got a job in Da Nang, so his family had to move. I was really sad, and I was afraid we would lose touch. Luckily, we still keep in touch through social media, and we meet whenever he visits Hanoi in the summer. What made me like him so much was that he was generous, funny and always stood up for me – once he even argued with an older boy who was teasing me. I have so many fond memories of our childhood together.",
  p3:[
    { q:"Do you still keep in touch with your friends from childhood? Why or why not?", h:["Yes, with a few of them","Social media makes it easy","I message Tuan almost every week and meet him in summer","With others I lost touch because we moved schools"],
      s:"Yes, with a few of them, mainly because social media makes it so easy. I message my childhood friend Tuan almost every week, and we meet whenever he comes back to Hanoi. But I’ve lost touch with many others, simply because we went to different schools and developed different interests." },
    { q:"How important is childhood friendship to children?", h:["Very important","Children learn to share, cooperate and solve conflicts","Playing football with neighbours taught me teamwork and how to lose","It also helps them feel happy and confident"],
      s:"It’s very important, because through friendship children learn to share, cooperate and solve conflicts. For example, playing football with the kids in my neighbourhood taught me teamwork and how to accept losing. Having good friends also makes children feel happier and more confident at school." },
    { q:"What do you think of communicating via social media?", h:["Convenient but less personal","It’s fast, free and connects people far away","I can video call my friend in Da Nang for free","But misunderstandings happen easily in text"],
      s:"I think it’s very convenient, because it’s fast, free and connects people who live far apart. I can video call my friend in Da Nang anytime without paying anything. However, it’s less personal than meeting face to face, and misunderstandings happen easily when we only send text messages." },
    { q:"Do you think online communication through social media will replace face-to-face communication?", h:["No, not completely","People still need real contact and emotions","During lockdown, everyone chatted online but couldn’t wait to meet in person again","Online will support, not replace"],
      s:"No, I don’t think it will completely replace it, because people still need real contact, like hugs and eye contact. During the lockdowns, for example, everyone chatted online all the time, but as soon as restrictions ended, my friends and I rushed to meet in person. Online communication will support face-to-face contact, not replace it." },
    { q:"What’s the difference between having younger friends and older friends?", h:["Older friends give advice; younger friends bring energy","They have different experiences","An older friend helped me choose my high school; with younger cousins I feel like a role model","Both help us grow in different ways"],
      s:"Older friends usually give us advice because they have more experience, while younger friends bring fun and energy. For instance, an older friend helped me choose my high school, whereas with my younger cousins I feel like a role model and become more responsible. Both kinds of friendship help us grow in different ways." },
    { q:"Has technology changed people’s friendships? How?", h:["Yes, in both good and bad ways","It’s easier to keep in touch but friendships can be shallower","I have 500 Facebook friends but only 5 real close friends","People sometimes look at phones instead of talking when they meet"],

  vocab:[

    ["get away from it all","thoát khỏi mọi bộn bề","We went there to get away from it all."],
    ["fresh air","không khí trong lành","The fresh air made me feel so healthy."],
    ["off the beaten track","ít người biết đến, hẻo lánh","Pu Luong is still off the beaten track."],
    ["peace and quiet","sự yên bình, tĩnh lặng","I loved the peace and quiet at night."],
    ["recharge my batteries","nạp lại năng lượng","The trip helped me recharge my batteries."],
    ["unspoilt","hoang sơ, chưa bị tàn phá","The countryside there is still unspoilt."]
  ],
  s:"I’d like to talk about a homestay in Pu Luong, a nature reserve in Thanh Hoa province, about four hours’ drive from Hanoi. I went there with my parents and my younger brother last summer. We went mainly because Hanoi was boiling hot and noisy, and my mum had seen some beautiful photos of the area online, so she wanted us to get away from it all for a few days. The homestay was a wooden stilt house surrounded by green rice terraces, and from our balcony we had a breathtaking view of the valley. Since the area is still quite off the beaten track, there were very few tourists. During the day, we walked through the rice fields, swam in a cold stream and ate delicious local food like bamboo-tube rice. At night, there was no traffic at all, just the sound of insects, and I really enjoyed the peace and quiet. I feel that this place is one of the most relaxing places I’ve ever been to. The fresh air and unspoilt scenery helped me recharge my batteries, and I’d love to go back in harvest season, when the fields turn golden.",
  p3:[
    { q:"Are there any natural attractions that are great to visit?", h:["Yes, Vietnam has many","Our country has mountains, caves, beaches and bays","Ha Long Bay – my family took a boat trip and kayaked into a cave","Phong Nha caves and Sa Pa are also amazing"],
      s:"Yes, plenty. Vietnam is lucky to have mountains, caves, beaches and bays. A great example is Ha Long Bay. When my family went there two years ago, we took a boat trip and kayaked into a small cave between the limestone islands – it felt like a film. Places like Phong Nha caves and Sa Pa are also definitely worth visiting." },
    { q:"Do you think it is necessary to include natural spaces in a city?", h:["Yes, absolutely necessary","They give people fresh air and a place to relax","Every morning hundreds of people exercise around Hoan Kiem Lake – my grandparents go at 5 a.m.","Without them, cities would be hotter and more stressful"],
      s:"Yes, I think it’s absolutely necessary, because natural spaces give people fresh air and somewhere to relax. In Hanoi, for instance, hundreds of people exercise around Hoan Kiem Lake every morning – my grandparents go there at five a.m. to walk and do tai chi. Without parks and lakes, cities would be even hotter and more stressful." },
    { q:"Do you think people who live in natural places are more likely to protect it?", h:["Generally yes","Their lives depend on the forests, rivers and land","Villagers in Pu Luong told us they plant trees to stop landslides that could destroy their homes","But poverty sometimes forces them to cut trees"],
      s:"Generally, yes, because their lives depend directly on nature. When I stayed in Pu Luong, the homestay owner told us that villagers plant trees on the hills to prevent landslides, which could destroy their homes and fields. However, if people are very poor, they may have to cut down trees or hunt animals just to survive." }
  ]},

    ["a hidden gem","viên ngọc ẩn, nơi ít người biết","The rooftop garden is a hidden gem."]
  ],
  s:"The public building I enjoy visiting is the National Library of Vietnam, which is on Trang Thi Street in the centre of Hanoi. I first heard about it from my English teacher, who recommended it as a good place to revise before my high school entrance exam. Since then, I’ve gone there almost every weekend. From the outside, it’s an old yellow building with French colonial architecture, tall windows and green shutters, and there are big trees in the front yard. Inside, there are long corridors, tall wooden bookshelves and a large, modern reading room with air conditioning. I got a library card for a very small fee, so now I can borrow books from a wide range of subjects, especially English novels. I enjoy visiting it for several reasons. First, it’s quiet and the study atmosphere is amazing – seeing everyone else working hard makes me concentrate on my work for hours. Second, it’s cool and comfortable, which is a big deal in Hanoi’s summer. Finally, it feels like a hidden gem in the middle of the busy city. Whenever I feel stressed, going there helps me calm down.",
  p3:[

      s:"Yes, I think they’re very valuable, because they show our history and culture in a way books can’t. For example, the Temple of Literature in Hanoi is almost a thousand years old, and when my class visited it, we learned more in one hour than from a whole chapter of our textbook. Old buildings also attract lots of tourists." },
    { q:"Do you think all old buildings should be demolished?", h:["No, definitely not","We would lose our history and character","Old French villas on Phan Dinh Phung Street make Hanoi unique – visitors take photos there every day","Only unsafe buildings that can’t be repaired should be replaced"],
      s:"No, definitely not. If we demolished every old building, our cities would lose their history and character. On Phan Dinh Phung Street in Hanoi, for instance, the old French villas make the area unique, and I see tourists taking photos there every day. I think only buildings that are really unsafe and can’t be repaired should be pulled down." },
    { q:"Is it better to live in an apartment than in a house?", h:["It depends on the family","Apartments are safer and have facilities; houses are bigger and more private","My cousin’s apartment has a pool and security, but my house has a rooftop for my mum’s garden","For young couples, apartments; for big families, houses"],
      s:"It depends on the family. Apartments are usually safer and come with facilities, while houses are bigger and more private. My cousin’s apartment, for example, has a swimming pool and 24-hour security, which I love. But in our house, my mum has a rooftop garden and we never worry about noise from neighbours. So for young couples apartments are great, but big families may prefer houses." }
  ]},
{ cat:"place", id:"pl-citynature", name:"Natural place in your city", title:"Describe a natural place in your city that you enjoy visiting",
  bullets:["where it is","what it is like","how often you go there","who you often go there with"], ending:"and explain why you enjoy visiting there.",
  f:"W", link:"",
  outline:[["Where","West Lake (Hồ Tây), Tay Ho district, Hanoi"],["What it is like","the biggest lake in Hanoi, 17 km path, lotus, sunset, cafés"],["How often","about twice a month, usually at weekends"],["Who with","my best friend – we cycle around it"],["What we do","cycle, eat shrimp cakes, watch the sunset"],["Why I enjoy it","cool breeze, open space, a break from studying"]],
  vocab:[
    ["go for a bike ride","đạp xe dạo","We go for a bike ride around the lake."],
    ["cool breeze","làn gió mát","There’s always a cool breeze by the lake."],
    ["watch the sunset","ngắm hoàng hôn","We stop to watch the sunset."],
    ["lotus","hoa sen","In summer, the lake is full of lotus."],
    ["open space","không gian thoáng đãng","I love the open space after a week in class."],
    ["a breath of fresh air","một luồng gió mới, điều dễ chịu","The lake is a breath of fresh air in the busy city."],
    ["take my mind off","giúp tôi quên đi (lo lắng)","Cycling helps take my mind off exams."],
    ["scenic","đẹp như tranh","The road around the lake is very scenic."]
  ],
  s:"I’d like to talk about West Lake, which is in Tay Ho district, in the north of Hanoi. It’s the biggest lake in the city, and there’s a path of about seventeen kilometres all the way around it. The path is quite scenic: on one side you have the water, and on the other side there are trees, small temples and lots of cafés. In summer, part of the lake is covered with pink lotus, and people come to take photos in traditional áo dài. I go there about twice a month, usually on Saturday afternoons, with my best friend Lan. We go for a bike ride around the lake, then stop to eat shrimp cakes, a famous local snack, and finally sit by the water to watch the sunset. There are a few reasons why I enjoy it so much. Firstly, there’s always a cool breeze, even on hot days. Secondly, after a whole week sitting in a classroom, the open space feels like a breath of fresh air. Most importantly, cycling and chatting with my friend really helps take my mind off exams and homework. For me, it’s the most relaxing place in Hanoi.",
  p3:[
    { q:"Do you think there should be many natural places in cities?", h:["Yes, as many as possible","They reduce heat and pollution and improve health","When a small park opened near my house, the empty land full of rubbish became a place where kids play every evening","But land in cities is expensive, so it needs good planning"],
      s:"Yes, as many as possible, because natural places reduce heat and pollution and help people stay healthy. Near my house, for example, there used to be an empty piece of land full of rubbish. Two years ago it became a small park, and now every evening it’s full of children playing and old people exercising. Of course, city land is expensive, so it needs careful planning." },
    { q:"Do you think staying in a natural place would help change people’s mood?", h:["Yes, definitely","Nature makes people calmer and less stressed","After my mock exam I felt terrible, but an hour cycling around West Lake made me feel much better","Doctors also recommend walking in green spaces"],
      s:"Yes, definitely. Being in nature makes people calmer and reduces stress. I remember after my mock exam last year, I felt really disappointed with my result. My friend took me cycling around West Lake, and after just an hour of fresh air and watching the sunset, I felt much more positive. That’s why many doctors suggest walking in green spaces." },
    { q:"Which is more important, protecting the environment or developing the economy?", h:["Both, but the environment in the long run","A damaged environment harms the economy later","In 2016, factory pollution killed fish along the central coast and local fishermen lost their income","Countries should choose green development"],
      s:"Both matter, but I think protecting the environment is more important in the long run, because a damaged environment eventually harms the economy too. A good example is the 2016 sea pollution in central Vietnam, when a factory’s waste killed huge numbers of fish and thousands of fishermen and hotels lost their income. So countries should aim for green development, not growth at any cost." }
  ]},
{ cat:"place", id:"pl-cityagain", name:"City to visit again", title:"Describe a city that you have been to and would like to visit again",
  bullets:["when you visited it","what you did there","what it was like"], ending:"and explain why you would like to visit it again.",
  f:"T", link:"",
  outline:[["Before","heard about Hoi An from friends, saw photos of lanterns"],["When","last summer, 3 days with my family"],["Day 1","walked around the Ancient Town, tried cao lầu and bánh mì"],["Day 2","cycled to An Bang beach, had clothes made by a tailor"],["Evening","released a paper lantern on the Hoai River"],["Why go again","peaceful, charming, friendly people; want to see the Lantern Festival"]],
  vocab:[
    ["ancient town","phố cổ","Hoi An Ancient Town is a World Heritage Site."],
    ["charming","duyên dáng, quyến rũ","The narrow streets are really charming."],
    ["lantern","đèn lồng","Every shop has a colourful silk lantern."],
    ["local specialities","đặc sản địa phương","We tried all the local specialities."],
    ["laid-back","thư thái, chậm rãi","The city has a laid-back atmosphere."],
    ["tailor-made","may đo","I had a tailor-made shirt in one day."],
    ["soak up the atmosphere","tận hưởng bầu không khí","We sat by the river to soak up the atmosphere."],
    ["leave a lasting impression","để lại ấn tượng sâu sắc","Hoi An will leave a lasting impression on any visitor."]
  ],
  s:"The city I’d like to talk about is Hoi An, in central Vietnam. Before going there, I’d seen lots of photos of its colourful lanterns on social media, so I was really excited when my family decided to spend three days there last summer. On the first day, we walked around the ancient town. The streets were narrow and full of old yellow houses, and we tried local specialities like cao lầu noodles and the famous Hoi An bánh mì. On the second day, we rented bicycles and rode through rice fields to An Bang beach, and in the afternoon my mum and I had tailor-made clothes made by a local tailor, which were ready in just one day. In the evening, we took a small boat on the Hoai River and released paper lanterns, making a wish. The whole city had a laid-back and charming atmosphere, and the people were very friendly. I’d love to visit it again for a few reasons. First, three days weren’t enough to soak up the atmosphere. Second, I want to go back for the Lantern Festival, when the lights are turned off and only lanterns light up the town. It really left a lasting impression on me.",
  p3:[
    { q:"What’s the difference between the city and the countryside?", h:["Cities are busier and more convenient; the countryside is calmer and greener","Jobs, services and traffic are concentrated in cities","In Hanoi I hear motorbikes all day, but at my grandparents’ village in Nam Dinh I wake up to roosters","Life in the countryside is slower and cheaper"],
      s:"The main difference is that cities are busy and convenient, while the countryside is calm and green. In Hanoi, for example, I hear motorbikes and horns all day long, but when I stay at my grandparents’ village in Nam Dinh, I wake up to the sound of roosters and see rice fields from the window. Life there is also slower and much cheaper." },
    { q:"Some people say large cities are suitable for old people. What do you think?", h:["Partly true","Cities have better hospitals and services","My grandfather moved to Hanoi to be near Bach Mai Hospital for his heart treatment","But noise, pollution and traffic can be hard for elderly people"],
      s:"I think it’s partly true. Big cities have better hospitals and more services, which older people need. My grandfather, for instance, moved to Hanoi three years ago so he could be near Bach Mai Hospital for his heart treatment. On the other hand, the noise, pollution and crazy traffic make it difficult for him to go out alone." },
    { q:"Do you think it is possible that all of the population move to cities?", h:["No, I don’t think so","Countries still need farmers and food","My uncle grows rice in Thai Binh; without people like him, cities would have nothing to eat","Some people also simply love quiet country life"],
      s:"No, I don’t think it’s possible. Countries still need people to grow food. My uncle, for example, is a rice farmer in Thai Binh, and his rice goes to markets in Hanoi – without farmers like him, city people would have nothing to eat. Besides, many people, especially older ones, simply love the peaceful life in the countryside." },
    { q:"Do you think people in the countryside are friendlier than people in the city?", h:["Generally yes","They know their neighbours and have more time","In my grandma’s village, neighbours bring food when someone is sick; in my apartment, I don’t know the people next door","City people are friendly too, just busier"],
      s:"Generally, yes, mainly because people in the countryside know their neighbours well and have more time. In my grandmother’s village, for instance, when someone is ill, the neighbours bring food and help with the housework. In my apartment building in Hanoi, though, I barely know the people next door. City people aren’t unfriendly – they’re just very busy." },
    { q:"Are there any changes in your city?", h:["Yes, many changes","The city is developing quickly","Hanoi now has metro lines – I take the Cat Linh–Ha Dong line to my extra class in 20 minutes instead of 45","But there are also more cars and traffic jams"],
      s:"Yes, lots of changes. Hanoi is developing very fast. The biggest change for me is the metro. I now take the Cat Linh–Ha Dong line to my extra class, and it takes only twenty minutes instead of forty-five by motorbike. There are also many new shopping malls and apartment buildings. The downside is that there are more cars, so traffic jams are worse." },
    { q:"What should the government do to improve citizens’ safety?", h:["More CCTV, better street lighting and traffic rules","Most accidents and crimes happen in dark or crowded places","After cameras and lights were installed in a dark alley near my school, phone thefts there stopped","Strict drink-driving fines have also reduced accidents"],
      s:"The government should install more CCTV cameras, improve street lighting and enforce traffic rules strictly. For example, there was a dark alley near my school where several students had their phones stolen. After the local authority put up lights and cameras, the thefts stopped. Also, since heavy fines for drink-driving were introduced, there have been fewer serious accidents." }
  ]},
{ cat:"place", id:"pl-crowded", name:"Crowded place", title:"Describe a crowded place you went to",
  bullets:["where it was","when you went there","who you went there with","what you did there"], ending:"and explain how you felt about it.",
  f:"S", link:"",
  outline:[["Setting","Hoan Kiem walking street, New Year’s Eve last year, with my cousins"],["What happened","thousands of people waiting for fireworks, we couldn’t move"],["Problem","lost my cousin for 20 minutes, phone signal was weak"],["Best moment","the countdown and fireworks over the lake"],["Ending","found my cousin at the meeting point, went home at 1 a.m."],["Feelings","exciting but exhausting; next time watch from a rooftop café"]],
  vocab:[
    ["packed with people","chật kín người","The street was packed with people."],
    ["shoulder to shoulder","vai kề vai, chen chúc","We stood shoulder to shoulder for an hour."],
    ["countdown","đếm ngược","Everyone shouted during the countdown."],
    ["festive atmosphere","không khí lễ hội","I loved the festive atmosphere."],
    ["lose sight of","mất dấu, không nhìn thấy","It’s easy to lose sight of your friends in a crowd."],
    ["meeting point","điểm hẹn","We agreed on a meeting point before the fireworks."],
    ["squeeze through","len qua","We had to squeeze through the crowd."],
    ["a once-in-a-year experience","trải nghiệm mỗi năm chỉ có một lần","It was a once-in-a-year experience."]
  ],
  s:"I’d like to describe the walking street around Hoan Kiem Lake on New Year’s Eve last year. I went there with two of my cousins to watch the fireworks. We arrived at about nine p.m., but the whole area was already packed with people – families, couples, tourists and lots of teenagers like us. Within an hour, we were standing shoulder to shoulder and could hardly move. There was a festive atmosphere: street performers were singing, and vendors were selling balloons and snacks. Then something stressful happened. While we were trying to squeeze through the crowd to get closer to the lake, I lost sight of my younger cousin. The phone signal was so weak that I couldn’t call her, and I started to panic. Luckily, we had agreed on a meeting point near the post office, and after twenty long minutes, she appeared there. Just in time for the countdown! When the fireworks exploded over the lake, everyone cheered, and it was magical. We didn’t get home until one a.m. Overall, I felt it was exciting but exhausting. It was a once-in-a-year experience, but next time I’d rather watch from a rooftop café.",
  p3:[
    { q:"Which cities are overcrowded in your country?", h:["Hanoi and Ho Chi Minh City","Most jobs, universities and hospitals are there","My street in Hanoi used to be quiet, but now new apartments mean 15-minute queues at the traffic lights","Some smaller cities like Da Nang are growing fast too"],
      s:"Definitely Hanoi and Ho Chi Minh City, because most jobs, universities and big hospitals are there, so people from all over the country move in. On my street in Hanoi, for instance, three new apartment buildings were built in five years, and now it takes fifteen minutes just to get through one set of traffic lights at rush hour. Da Nang is getting crowded too." },
    { q:"Will there be more or less green space in cities in the future?", h:["I hope more, but I’m not sure","Governments know green space matters, but land is expensive","A new park was built near my school, but at the same time a big lawn nearby became a car park","It depends on city planning"],
      s:"I hope there’ll be more, but honestly I’m not sure. Governments know that green space is important, but city land is extremely valuable. Near my school, for example, a new park opened last year, but in the same month, a big grassy area down the road was turned into a car park. So it really depends on whether planners put people before profit." },
    { q:"Will people use bikes more or less in cities in the future?", h:["More, I think","Bikes are cheap, healthy and good for the environment","Hanoi’s public bike-sharing scheme – my friends and I rent bikes with an app for a few thousand dong","But the heat and traffic may stop some people"],
      s:"I think more people will use bikes, because they’re cheap, healthy and environmentally friendly. In Hanoi, for instance, there’s now a public bike-sharing scheme. My friends and I often rent bikes through an app for just a few thousand dong and ride around Hoan Kiem Lake. However, the heat and dangerous traffic may still put some people off." },
    { q:"Why do people go to crowded places?", h:["For the excitement and atmosphere","Events, festivals and good food attract everyone","On New Year’s Eve thousands go to Hoan Kiem Lake for the fireworks and countdown","Some places are crowded simply because they’re popular and cheap"],
      s:"Mostly for the excitement and the atmosphere. Big events, festivals and popular food streets attract lots of people at the same time. On New Year’s Eve, for example, I went to Hoan Kiem Lake with my cousins, and even though it was terribly crowded, counting down with thousands of strangers felt amazing. Some places are crowded simply because they’re cheap and famous." },
    { q:"Do you think there are some people who enjoy crowded places?", h:["Yes, definitely","Outgoing people get energy from crowds","My cousin loves night markets and music festivals – the busier, the happier she is","Introverts like me prefer quieter places"],
      s:"Yes, definitely. Some outgoing people actually get energy from being around lots of people. My cousin Mai is a perfect example – she loves night markets and music festivals, and the busier they are, the happier she seems. Introverts like me, on the other hand, feel tired after an hour in a crowd." },
    { q:"Do you think it is a good trend to have more big cities?", h:["Partly good, partly bad","Big cities create jobs but also pollution and traffic","My uncle found a well-paid job in Hanoi, but he spends two hours a day in traffic","Developing smaller cities would be more balanced"],
      s:"It’s partly good and partly bad. Big cities create jobs and opportunities, but they also bring pollution and traffic problems. My uncle, for instance, moved to Hanoi and found a well-paid job, but he spends nearly two hours in traffic every day. I think it would be better to develop more medium-sized cities, so people don’t all crowd into the same two places." }
  ]},
{ cat:"place", id:"pl-noisy", name:"Noisy place", title:"Describe a noisy place you have been to",
  bullets:["where it is","when you went there","what you did there"], ending:"and explain why you feel it’s a noisy place.",
  f:"W", link:"",
  outline:[["Where","Ta Hien beer street, Old Quarter, Hanoi"],["When","last month, Saturday night, after a school event"],["Who with","classmates"],["What we did","ate grilled food, drank soft drinks, watched street performers"],["Why noisy","loud music from bars, people shouting, motorbikes, vendors"],["Feelings","fun for an hour, then a headache"]],
  vocab:[
    ["deafening","điếc tai","The music was deafening."],
    ["blare out","phát ra ầm ĩ","Every bar lets music blare out onto the street."],
    ["raise my voice","nói to lên","I had to raise my voice to be heard."],
    ["bustling","nhộn nhịp, tấp nập","It’s the most bustling street in the Old Quarter."],
    ["couldn’t hear myself think","ồn đến mức không suy nghĩ được","It was so loud I couldn’t hear myself think."],
    ["street performer","người biểu diễn đường phố","A street performer was playing the guitar."],
    ["lively","sôi động","The atmosphere was very lively."],
    ["gave me a headache","làm tôi đau đầu","The noise gave me a headache."]
  ],
  s:"The noisiest place I’ve ever been to is Ta Hien Street in Hanoi’s Old Quarter, which is famous among tourists as ‘beer street’. I went there last month on a Saturday night with a few classmates after our school’s music event. We sat on tiny plastic stools on the pavement, ordered grilled sweet potatoes and chicken feet with soft drinks, and watched people walking past. There was also a street performer playing the guitar and doing magic tricks. It’s a really bustling place, and the atmosphere is very lively, but it’s incredibly noisy. Every bar has huge speakers, and music blares out from all directions at the same time, so the sound is deafening. On top of that, waiters shout to attract customers, vendors call out their prices, and people sing and cheer at football matches on TV. Motorbikes also try to push through the crowd and honk their horns. We had to raise our voices just to talk to the person sitting next to us, and at one point I literally couldn’t hear myself think. It was fun for about an hour, but after that the noise gave me a headache, so we left early and walked to the quiet lake to cool down.",
  p3:[
    { q:"Do you think it is good for children to make noise?", h:["Yes, to some extent","Noise is a natural part of playing and learning","My 5-year-old cousin sings and shouts while playing – that’s how she learns new words","But they should learn when to be quiet"],
      s:"Yes, to some extent, because noise is a natural part of playing and learning. My five-year-old cousin, for instance, sings, shouts and talks to her toys all afternoon, and that’s actually how she practises new words. Of course, children also need to learn that there are times and places where they should be quiet." },
    { q:"Should children not be allowed to make noise under any circumstances?", h:["No, that’s too strict","Children need freedom to express themselves","My neighbour’s son was always told to be silent; he became very shy at school","Instead, teach them where noise is OK and where it isn’t"],
      s:"No, I think that’s far too strict. Children need the freedom to express themselves and burn off energy. My neighbour’s son, for example, was always told to sit still and be silent at home, and now he’s extremely shy and hardly speaks in class. It’s better to teach kids where noise is fine, like the playground, and where it isn’t, like hospitals." },
    { q:"What kinds of noises are there in our life?", h:["Traffic, construction, neighbours and electronic devices","Cities are full of machines and people","In my area, a building site starts drilling at 7 a.m., and my neighbour sings karaoke every Sunday","There are pleasant sounds too, like birds and rain"],
      s:"There are so many – traffic, construction, neighbours and electronic devices. In my neighbourhood, for example, a building site starts drilling at seven a.m. every day, and my next-door neighbour sings karaoke very loudly every Sunday. Not all noise is bad, though – I find the sound of rain or birds in the morning very relaxing." },
    { q:"Which area is exposed to noise more, the city or the countryside?", h:["The city, by far","More traffic, construction and people","In Hanoi I hear horns all day; at my grandparents’ village it’s silent except for roosters","But village festivals and loudspeakers can be noisy too"],
      s:"The city, by far, because there’s much more traffic, construction and people. In Hanoi, I hear motorbike horns from morning till night, while at my grandparents’ village in Nam Dinh it’s almost silent, apart from roosters at dawn. Having said that, the countryside can be noisy during village festivals, when loudspeakers play music all day." },
    { q:"How would people usually respond to noises in your country?", h:["Most people just put up with it","They see noise as normal and don’t want conflict","My family never complains about the neighbour’s karaoke – we just close the windows","Only when it’s very late do people call the local police"],
      s:"Most Vietnamese people just put up with it, because noise is seen as a normal part of life and people don’t want to argue with their neighbours. My family, for instance, never complains about our neighbour’s Sunday karaoke – we just close the windows. Only when it goes on very late at night do people call the local ward police." },
    { q:"How can people consider others’ feelings when chatting in public?", h:["Lower their voices and use headphones","Others may be resting, studying or working","On the metro, a man had a loud video call and everyone looked annoyed","Simple awareness makes public places nicer"],
      s:"People should lower their voices, avoid loud phone calls and use headphones, because others around them may be resting or studying. Last week on the metro, for example, a man had a very loud video call on speaker, and everyone in the carriage looked annoyed. A little awareness like this makes public places much more pleasant for everyone." }
  ]}
);

PART2.push(
{ cat:"place", id:"pl-recommend", name:"Place to recommend", title:"Describe a place you have travelled to that you would like to recommend to others",
  bullets:["what it is","where it is","what you saw and did there"], ending:"and explain why you would like to recommend it to others.",
  f:"W", link:"",
  outline:[["What","Phong Nha–Ke Bang National Park"],["Where","Quang Binh province, central Vietnam"],["When / who","two summers ago, with my family, 3 days"],["What we saw and did","Phong Nha Cave by boat, Paradise Cave, zip-line and swimming at Dark Cave"],["Why recommend","amazing caves, adventure, cheap, friendly locals; good for families and young people"]],
  vocab:[
    ["national park","vườn quốc gia","Phong Nha is a famous national park."],
    ["stalactites","thạch nhũ","The cave is full of huge stalactites."],
    ["took my breath away","làm tôi choáng ngợp","The size of the cave took my breath away."],
    ["adventure activities","hoạt động mạo hiểm","There are lots of adventure activities, like zip-lining."],
    ["worth every penny","đáng từng đồng","The tour was worth every penny."],
    ["must-see","nơi nhất định phải đến","Paradise Cave is a must-see."],
    ["budget-friendly","phù hợp túi tiền","It’s a budget-friendly destination."],
    ["highly recommend","rất khuyên nên đi","I highly recommend this place to everyone."]
  ],
  s:"The place I’d highly recommend is Phong Nha–Ke Bang National Park in Quang Binh province, central Vietnam. It’s famous for having some of the biggest and most beautiful caves in the world. I went there two summers ago with my family and we stayed for three days. On the first day, we took a small wooden boat along the Son River into Phong Nha Cave. Inside, it was cool and dark, and there were huge stalactites lit up in different colours. The next day we visited Paradise Cave, which is over thirty kilometres long – we only walked the first kilometre on a wooden path, but the size of it really took my breath away. On the last day, we tried some adventure activities at Dark Cave: we flew on a zip-line over the river, swam into the cave and bathed in mud, which was hilarious. There are several reasons why I’d recommend it. First, the caves are a real must-see; you can’t find scenery like that anywhere else. Second, it suits both families and adventurous young people. Finally, it’s a budget-friendly destination – food and homestays are cheap, and the locals are very friendly. Every activity was worth every penny.",
  p3:[
    { q:"Where do people in your country often go for holidays?", h:["Beaches in summer, mountains in cooler months","Vietnam has a long coastline and beautiful highlands","Every June my family goes to Sam Son or Cua Lo beach, and the hotels are full","Young people also love Da Lat and Sa Pa"],
      s:"In summer, most Vietnamese families go to the beach, because we have a very long coastline. My family, for instance, goes to Sam Son beach almost every June, and it’s so popular that the hotels are fully booked weeks in advance. In cooler months, young people prefer mountain towns like Da Lat or Sa Pa, where they can enjoy the cool weather and take beautiful photos." },
    { q:"What is the ideal length for a holiday?", h:["About five to seven days","Long enough to relax but not too expensive","Our 3-day trip to Phong Nha felt rushed – we spent a whole day travelling","Students can take longer holidays in summer"],
      s:"I’d say about five to seven days, because that’s long enough to really relax without costing too much. When my family went to Phong Nha for only three days, it felt quite rushed, since we spent almost one whole day travelling there and back. For students, though, a longer summer holiday of ten days or more would be ideal." },
    { q:"How do people usually plan holidays?", h:["Online – booking apps, social media reviews and travel groups","It’s quick and you can compare prices","My mum plans every trip using Facebook travel groups and booking apps, and saves about 20%","Older people still use travel agencies"],
      s:"These days most people plan holidays online, because it’s quick and they can compare prices easily. My mum, for example, joins Facebook travel groups to read real reviews, then books hotels on an app during sales – she says she saves about twenty percent that way. Older people, like my grandparents, still prefer to book package tours through travel agencies." },
    { q:"Is it important to plan a holiday?", h:["Yes, but don’t over-plan","Planning saves money and avoids problems","We didn’t book a hotel in Da Lat during a holiday weekend and had to stay in a terrible room","Leave some free time for surprises"],
      s:"Yes, I think it’s important, but you shouldn’t plan every minute. Planning helps you save money and avoid problems. Last year, for example, my family went to Da Lat on a public holiday without booking, and every good hotel was full, so we ended up in a tiny, noisy room. Still, it’s good to leave some free time for unexpected discoveries." }
  ]},
{ cat:"place", id:"pl-tall", name:"Tall building", title:"Describe a tall building you like or dislike",

  s:"I’d like to talk about a tall building I really like, which is Lotte Center Hanoi. It’s located on Lieu Giai Street in Ba Dinh district, not far from the city centre. It’s a mixed-use building: the lower floors are a shopping mall, the middle floors are offices, the upper floors are a hotel, and at the very top there’s an observation deck. The building has sixty-five floors and is about two hundred and seventy metres tall. It has a curved glass facade, and I read that the shape was inspired by the traditional áo dài, which I think is a clever idea. I visited the observation deck with my cousins last year. The state-of-the-art lift took us to the sixty-fifth floor in less than a minute, which made my ears pop! There’s a glass floor that sticks out from the building, and standing on it was terrifying but exciting. We stayed until sunset and had a bird’s-eye view of the whole city, with the lakes and the Red River shining in the evening light. I like it because it has become a modern landmark and changed Hanoi’s skyline. The only thing I dislike is the heavy traffic around it at rush hour.",
  p3:[

      s:"Yes, more and more, but mainly in big cities like Hanoi and Ho Chi Minh City, because land there is very expensive, so developers build upwards. When I was a child, I could only see low rooftops from my bedroom window; now I can count six tower blocks of thirty floors or more. In the countryside, though, most buildings are still only two or three storeys." },
    { q:"What are the differences between those tall buildings in your country?", h:["Purpose, design and quality","Some are luxury offices, others are cheap apartments","Landmark 81 in Ho Chi Minh City has a mall and hotel, while my aunt’s social-housing block has small flats and a basic lift","Newer buildings are more modern and eco-friendly"],
      s:"The main differences are their purpose, design and quality. Some are luxury buildings with offices, hotels and malls, like Landmark 81 in Ho Chi Minh City. Others are affordable apartment blocks. My aunt, for instance, lives in a social-housing building where the flats are small and there’s only one slow lift. Newer towers also tend to be more eco-friendly, with solar panels and green roofs." },
    { q:"Why are different places laid out and designed differently?", h:["Because of climate, history and how people live","Buildings must suit local weather and culture","Hanoi’s Old Quarter has narrow ‘tube houses’ because shops were taxed by width; Hoi An has yellow walls and wooden shutters","Modern needs like cars also change layouts"],
      s:"Mainly because of climate, history and people’s way of life. In Hanoi’s Old Quarter, for example, houses are very narrow but long – people call them ‘tube houses’ – because in the past, shops were taxed according to how wide their front was. In Hoi An, buildings have thick walls and wooden shutters to keep cool. Today, modern needs like car parks also shape new layouts." }
  ]},
{ cat:"place", id:"pl-boring", name:"Boring place", title:"Describe a boring place",

  outline:[["Setting","an industrial exhibition centre, outskirts of Hanoi, a school trip last year"],["Who","my whole class and two teachers"],["What happened","listened to long talks about machines, read information boards, 3 hours"],["Worst moment","guide spoke in a monotonous voice, no air-con, nothing to touch"],["Ending","the best part was lunch and the bus ride back"],["Why boring","nothing interactive, too technical, not for teenagers"]],
  vocab:[

  ],
  s:"The most boring place I’ve been to is an industrial exhibition centre on the outskirts of Hanoi. I went there last year on a school trip with my whole class and two teachers. We were told it would be an exciting day out, so everyone was quite happy on the bus. However, as soon as we arrived, we realised it was going to be a long day. The building was huge but quite dark, and the air conditioning wasn’t working. A guide led us from one machine to another, and she explained how each one worked in a monotonous voice. Most of the information was far too technical for us, and we weren’t allowed to touch anything – there was nothing interactive at all, just old machines and long information boards. The tour seemed to drag on forever. After about an hour, half of my class started to yawn, and some of my friends secretly played games on their phones. Personally, I was counting the minutes until lunch. Honestly, the best part was the bus ride home, when we sang songs together. I think it was boring because it wasn’t designed for teenagers, so most of us felt it was a waste of time.",
  p3:[
    { q:"Why do most children think education is boring?", h:["Because lessons focus on memorising, not doing","Children learn best through play and activity","My little brother hates history homework – copying dates – but loves the history quiz game his teacher made","Too much homework and exams make it worse"],
      s:"I think it’s because many lessons focus on memorising rather than doing, while children learn best through activities and play. My little brother, for example, hates his history homework because he just copies dates into a notebook. But when his teacher turned the lesson into a quiz game, he came home and told us about it all evening. Heavy homework and exam pressure make education feel even more boring." },
    { q:"Why aren’t young people willing to listen to the experiences of older people?", h:["They think the world has changed too much","Older people’s advice can feel old-fashioned or like lecturing","My grandpa advises me to work for the state like him, but I want a job in IT","When elders tell stories instead of giving orders, young people listen more"],
      s:"Mainly because young people feel the world has changed so much that older people’s experience doesn’t apply any more, and sometimes advice sounds like a lecture. My grandfather, for example, keeps telling me to get a stable government job like he had, but I want to work in IT. However, when he tells me stories about his own mistakes instead of giving orders, I actually listen." },
    { q:"What can people do when they feel bored?", h:["Try something active or creative","Screens often make boredom worse","Last summer when I was bored I started learning to cook from YouTube, and now I make dinner on Sundays","Meeting friends or doing sport also helps"],
      s:"I think people should try something active or creative, rather than just scrolling on their phones, which often makes boredom worse. Last summer, for instance, I felt really bored during the holidays, so I started learning to cook from YouTube videos. Now I make dinner for my family every Sunday. Meeting friends or playing a sport is also a great way to beat boredom." },
    { q:"Why are some teachers’ classes boring? Are there any solutions?", h:["Teachers just read from slides or textbooks","Students stay passive and lose focus","My chemistry teacher used to read every slide aloud; when she added group experiments, the whole class woke up","Training teachers and smaller classes can help"],
      s:"Some classes are boring because teachers just read from the textbook or slides, so students stay passive and lose focus. My chemistry teacher, for example, used to read every slide aloud, and half the class fell asleep. Then she started adding short group experiments, and suddenly everyone paid attention. So one solution is to make lessons more interactive, and schools could give teachers more training and smaller classes." }
  ]},
{ cat:"place", id:"pl-homevisit", name:"Home you like to visit", title:"Describe a home that you like to visit but do not want to live in",

  outline:[["Whose / where","my grandparents’ house in a village in Nam Dinh"],["What it is like","one-storey house, big front yard, fish pond, vegetable garden, ancestral altar"],["When I visit","Tết and summer holidays"],["Why I like visiting","peaceful, fresh food, play with cousins, grandparents spoil me"],["Why not live there","far from school and friends, weak internet, mosquitoes, nothing to do at night"]],
  vocab:[

    ["front yard","sân trước","We dry rice in the front yard."],
    ["ancestral altar","bàn thờ tổ tiên","There’s an ancestral altar in the main room."],
    ["home-grown","nhà trồng được","All the vegetables are home-grown."],

    ["spoil","chiều chuộng","My grandparents always spoil me."],

    ["miss out on","bỏ lỡ","I’d miss out on time with my friends."]
  ],
  s:"The home I love visiting is my grandparents’ house in a small village in Nam Dinh province, about two hours from Hanoi. It’s a traditional one-storey house with a red tiled roof. In front of it, there’s a large front yard where my grandparents dry rice after the harvest, and behind it there’s a fish pond and a vegetable garden. Inside, the main room has a big wooden ancestral altar, where we burn incense on special occasions. I usually visit at Tết and for a week every summer. I like going there for several reasons. First, it’s very peaceful – there’s no traffic, only the sound of chickens and wind in the trees. Second, the food is amazing, because almost everything is home-grown, from vegetables to chickens and fish. Third, my cousins also come, so we fish in the pond and fly kites in the fields. And of course, my grandparents spoil me with snacks! However, I wouldn’t want to live there. The house is a bit in the middle of nowhere: it’s far from good schools, the internet is weak, there are lots of mosquitoes, and there’s nothing to do at night. I’d also miss out on time with my friends in Hanoi.",
  p3:[
    { q:"Do Vietnamese people like to visit others’ homes?", h:["Yes, very much","Visiting shows care and keeps relationships close","At Tết my family visits about 15 houses of relatives and neighbours in 3 days","In big cities people visit less often because they’re busy"],
      s:"Yes, very much. For Vietnamese people, visiting someone’s home is a way to show care and keep relationships close. During Tết, for example, my family visits around fifteen houses of relatives, neighbours and my parents’ friends in just three days, and we drink tea and eat candied fruit at every one. In big cities, though, people visit less often because they’re so busy." },
    { q:"What do Vietnamese people do when they visit others?", h:["Bring a small gift, drink tea and chat","It’s polite and shows respect to the host","When we visit my aunt, we bring fruit, she makes green tea and we talk about family news for hours","Often the host invites guests to stay for a meal"],
      s:"Usually they bring a small gift, like fruit or a box of cakes, because arriving empty-handed is considered impolite. When my family visits my aunt, for example, we always bring some fruit. She makes green tea, and we sit and chat about family news for hours. Very often, the host insists that guests stay for a meal, and it’s hard to say no!" },
    { q:"What kind of place do people in your country like to live in?", h:["A house of their own, close to work and family","Owning a house means security for Vietnamese people","My parents saved for 15 years to buy our house, and they say renting never felt like home","Young people now accept apartments in the city"],
      s:"Most Vietnamese people dream of owning their own house, close to work and family, because owning property means security. My parents, for example, saved for about fifteen years to buy our house, and they always say renting never felt like home. Nowadays, many young people in cities are happy with apartments, since houses have become far too expensive." },
    { q:"What’s the difference between homes in cities and those in the countryside?", h:["City homes are small and tall; country homes are wide with yards","Land in cities is expensive","My house in Hanoi is 4 floors on 40 m²; my grandparents’ house has a yard, pond and garden","Country homes are cheaper but further from services"],
      s:"The biggest difference is space. In cities, land is so expensive that homes are small and tall. My family’s house in Hanoi, for example, has four floors but stands on only forty square metres. My grandparents’ house in the countryside, on the other hand, has only one floor but a big yard, a pond and a garden. Country homes are cheaper, but they’re far from hospitals and good schools." }
  ]},
{ cat:"place", id:"pl-river", name:"Important river/lake", title:"Describe an important river/lake in your country",

  vocab:[
    ["flow through","chảy qua","The Red River seems to flow through every part of Hanoi’s history."],
    ["silt","phù sa","The water is red because of the silt."],
    ["fertile","màu mỡ","The land along the river is very fertile."],
    ["delta","đồng bằng châu thổ","The Red River Delta is a major rice-growing area."],

    ["irrigation","thuỷ lợi","Farmers use the river for irrigation."],
    ["flood","lũ lụt","A big flood can destroy whole rice fields."],
    ["lifeblood","nguồn sống","The river is the lifeblood of the north."]
  ],
  s:"I’d like to talk about the Red River, one of the most important rivers in Vietnam. It starts in China, then flows through the northern provinces of Vietnam, right through the middle of Hanoi, before reaching the sea. It’s about one thousand one hundred and fifty kilometres long, and around five hundred kilometres of that are in Vietnam. As its name suggests, the water looks reddish-brown, because it carries a huge amount of silt. In Hanoi, the river is very wide, and there are several long bridges across it, including the famous Long Bien Bridge, which is over a hundred years old. Along the banks, there are high dykes to protect the city, and in the middle there are sandy islands with banana fields. Last spring, my friends and I cycled along the dyke to the banana island, which was lovely. The river is important for several reasons. First, its silt has created the Red River Delta, where the land is very fertile, so it’s one of the biggest rice-growing areas in the country. Farmers also use its water for irrigation. Second, it’s been used for transport for centuries. Finally, Hanoi grew up beside it, so it’s part of our history. You could say it’s the lifeblood of the north.",
  p3:[
    { q:"What are the popular water sports in your country?", h:["Swimming, kayaking, rowing and surfing","We have long coasts, rivers and lakes","In Da Nang my cousin and I tried stand-up paddleboarding at My Khe beach","Traditional boat racing at festivals is also popular"],
      s:"The most popular ones are swimming, kayaking and, in some places, surfing, because Vietnam has a long coastline and lots of rivers and lakes. When I visited Da Nang last summer, my cousin and I tried stand-up paddleboarding at My Khe beach, and we kept falling into the water – it was hilarious. Traditional dragon boat racing at village festivals is also very popular." },

    { q:"How can rivers and lakes benefit local people?", h:["Jobs, food, water and leisure","Many families earn a living from them","My grandma’s neighbours fish and raise ducks along the river and sell them at the market","Lakes in cities also give people a place to exercise"],
      s:"They benefit local people in many ways, mainly by providing jobs, food and water. Near my grandmother’s village, for example, several families earn their living by fishing and raising ducks along the river, then selling them at the local market. In cities, lakes give people a free place to exercise – every evening, my mum walks around the lake near our house." },
    { q:"Do you think rivers and lakes attract tourists?", h:["Yes, definitely","Water makes scenery beautiful and offers activities","Thousands of tourists take boat trips on the Mekong to visit floating markets like Cai Rang","Lakes in Hanoi are also major attractions"],
      s:"Yes, definitely, because water makes scenery beautiful and offers lots of activities. In the Mekong Delta, for instance, thousands of tourists take early-morning boat trips to visit floating markets like Cai Rang, where people sell fruit straight from their boats. When I went there with my family, it was one of the highlights of our trip. In Hanoi, Hoan Kiem Lake is also a must-see for visitors." },
    { q:"How do rivers and lakes affect local tourism?", h:["They create jobs and businesses","Boat tours, homestays and restaurants grow around them","In Ninh Binh, women row tourists through Trang An’s caves, earning far more than from farming","But too many tourists can pollute the water"],
      s:"They have a big effect, because many businesses grow up around them, like boat tours, homestays and restaurants. In Trang An, Ninh Binh, for example, local women row tourists along the river through limestone caves. The boat driver we had told us she earns much more from this than from farming. However, too many tourists can also lead to rubbish and pollution in the water." },
    { q:"Are rivers and lakes good for transport? Why?", h:["Yes, especially for heavy goods","Boats are cheaper and use less fuel than trucks","In the Mekong Delta, rice and sand are moved by huge barges; I saw dozens on the Hau River","But they’re slow and depend on the weather"],

  ]},

  s:"A place I’d really love to visit in my free time is Ha Giang, a mountainous province in the far north of Vietnam, right next to the Chinese border. It’s been on my bucket list for years, ever since I saw videos of it on YouTube. I’m planning to go next summer, after my exams, with my older cousin and two friends. We’d like to do the famous Ha Giang Loop, a route of about three hundred and fifty kilometres through the mountains. We’ll each sit behind a local motorbike driver, because the roads are too dangerous for us. Along the way, we’ll stop at Ma Pi Leng Pass, which has a breathtaking view of the deep green Nho Que River and the Lung Cu flag tower. I’d also like to visit a weekly market where ethnic minority people come to buy and sell things in colourful traditional clothes. I think we’ll stay for about four days. I want to go there because the scenery is spectacular, and I’d like to immerse myself in a culture that is very different from life in Hanoi. It requires a sense of adventure, and I think it will be a once-in-a-lifetime trip before I start university.",
  p3:[
    { q:"Why do you think some people choose not to travel abroad?", h:["Cost, language and visas","Travelling abroad is expensive and can be stressful","My parents prefer Da Nang or Phu Quoc – they say it’s cheaper and they don’t need to worry about English","Vietnam itself has so many places to see"],

  ]}
);
