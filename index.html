<!doctype html>
<html lang="en" data-theme="princess">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speaking Forecast Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0; --card:#fff; --ink:#1d2433; --soft:#5d6677; --line:#e3ddd2; --chip:#f2eee6;
  --pri:#3f3cbb; --pri-l:#ecebff; --acc:#e8833a; --acc-l:#fff1e5;
  --a1:#2563eb; --a2:#0d9488; --a3:#d97706; --a4:#9333ea;
  --ok:#15803d; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
.vi{color:var(--soft);font-size:.9em}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
.hrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header h1{font-size:1.1rem;line-height:1.2}
header h1 small{display:block;font-size:.78rem;color:var(--soft);font-weight:500}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.tabs button{flex:none;border:0;background:none;padding:8px 14px;font-weight:700;color:var(--soft);border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--pri);border-color:var(--pri)}
main{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 80px}
.btn{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:7px 14px;font-weight:700}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.acc{background:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;margin-bottom:14px;min-width:0}
.card h3{font-size:1.1rem}
/* topic chips */
.tchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tchips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-weight:600;font-size:.92rem}
.tchips button[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}
.thead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.thead h2{font-size:1.5rem;line-height:1.2}
.tag{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 8px;background:var(--pri-l);color:var(--pri)}
.tag.gen{background:var(--acc-l);color:#b45309}
/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.vc{border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;display:grid;gap:1px;text-align:left}
.vc b{font-size:1.02rem}
.vc .v{color:#b45309;font-size:.92rem}
.vc i{font-size:.85rem;color:var(--soft)}
.hidevi .vc:not(.peek) .v{visibility:hidden}
.hidevi .vc{cursor:pointer}
/* questions */
.qs{display:grid;gap:12px}
.q{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;display:grid;gap:10px;scroll-margin-top:140px}
.q.flash{animation:fl 1.6s ease}
@keyframes fl{0%,40%{box-shadow:0 0 0 4px var(--acc)}100%{box-shadow:none}}
.qt{display:flex;gap:10px;align-items:flex-start}
.qn{flex:none;width:2em;height:2em;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.9rem}
.qt p{font-size:1.12rem;font-weight:700;padding-top:.15em}
.qtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qtools button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:4px 10px;font-weight:600;font-size:.9rem}
.qtools button[aria-expanded=true]{background:var(--pri-l);border-color:var(--pri);color:var(--pri)}
.fw{font-size:.72rem;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--soft);letter-spacing:.04em}
.hints{display:grid;gap:6px}
.hint{display:grid;grid-template-columns:7.5em 1fr;gap:8px;align-items:start;border-radius:10px;padding:6px 10px;background:var(--chip)}
.hint b{color:var(--hc,var(--pri))}
.hint b small{display:block;font-weight:600;color:var(--soft);font-size:.75rem}
@media (max-width:520px){.hint{grid-template-columns:1fr;gap:0}}
.sample{background:#fffbeb;border-left:4px solid var(--acc);border-radius:8px;padding:8px 12px;line-height:1.7}
mark{background:#fde68a;border-radius:4px;padding:0 2px;color:inherit}
.timer{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:9px;padding:1px 4px 1px 8px;background:#fff}
.timer output{font-variant-numeric:tabular-nums;font-weight:800;min-width:2.6em;text-align:center}
.timer.run{border-color:var(--pri)}
.timer.end output{color:var(--bad)}
.timer button{border:0!important;padding:3px 6px!important}
.ver{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ver button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:3px 12px;font-weight:700;font-size:.9rem}
.ver button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.timer small{font-weight:700;color:var(--soft);font-size:.78rem}
.cue{border:2px solid var(--ink);border-radius:12px;padding:12px 16px;background:#fff}
.cue ul{margin:4px 0;padding-left:22px}
.notes{width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;resize:vertical}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cats button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-weight:700}
.cats button span{display:inline-block;min-width:1.6em;border-radius:99px;background:var(--chip);font-size:.8rem;padding:0 6px;margin-left:2px}
.cats button[aria-pressed=true]{border-color:var(--acc);background:var(--acc-l);color:#9a4a0c}
/* how-to */
.fwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.steps{display:grid;gap:6px}
.steps div{display:grid;grid-template-columns:2.2em 1fr;gap:8px;align-items:start}
.steps span.l{width:2.2em;height:2.2em;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800}
.ex{background:var(--chip);border-radius:10px;padding:8px 12px;font-size:.95rem}
/* general */
.gcats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.gcat{background:#fff;border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:14px;padding:12px;display:grid;gap:6px;align-content:start}
.gcat h4{color:#b45309}
.gcat .vc{border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 0}
/* quiz */
.qz{max-width:760px;margin:0 auto}
.qbar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.qprompt{font-size:1.3rem;font-weight:700;line-height:1.4}
.qprompt .blank{display:inline-block;min-width:5em;border-bottom:3px solid var(--pri)}
.qkind{font-size:.85rem;color:var(--soft);font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:1.05rem;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{font-weight:700;min-height:1.5em}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.big{font-size:2.4rem;font-weight:800;color:var(--pri)}
.miss{display:grid;gap:4px}
.miss div{background:var(--badbg);border-radius:8px;padding:4px 10px}
select{border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;max-width:100%}

/* ================= THEME: pink-brown, polka dots, bows ================= */
:root{
  --bg:#fdf3f1; --card:#fffaf9; --ink:#4a302c; --soft:#8a6862; --line:#f0d8d3; --chip:#fbe9e6;
  --pri:#b45866; --pri-l:#fbe4e7; --acc:#8f5e4a; --acc-l:#f6e6dc;
  --a1:#b45866; --a2:#8f6a4a; --a3:#c47a3e; --a4:#8e5f9e;
  --dot:#f3d3d2;
}
body{font-family:"Lexend","Segoe UI",system-ui,sans-serif;font-weight:400;letter-spacing:-.005em;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 2.6px,transparent 3.2px),radial-gradient(var(--dot) 2.6px,transparent 3.2px);
  background-size:34px 34px;background-position:0 0,17px 17px;background-attachment:fixed}
h1,h2,h3,h4,b,strong,.btn,.tabs button{font-weight:600}
header{background:rgba(255,250,249,.94);backdrop-filter:blur(6px);border-bottom:0;box-shadow:0 2px 0 var(--line);
  background-image:radial-gradient(circle at 10px -2px,transparent 9px,var(--line) 9.5px,transparent 10.5px);background-size:20px 8px;background-position:bottom;background-repeat:repeat-x}
header h1{display:flex;align-items:center;gap:8px;font-size:1.15rem;color:var(--pri)}
header h1::before{content:"";width:50px;height:36px;flex:none;background:var(--deco) center/contain no-repeat}
header h1 small{color:var(--soft);font-weight:400}
.tabs{gap:6px;padding-bottom:8px}
.tabs button{border:0;border-radius:99px;padding:6px 14px;color:var(--soft);font-weight:500}
.tabs button[aria-selected=true]{background:var(--pri-l);color:var(--pri);font-weight:600}
.btn{border-radius:99px;box-shadow:0 3px 0 rgba(143,94,74,.25)}
.btn.ghost{box-shadow:none;border-color:var(--line);background:#fff}
.btn.acc{background:var(--acc)}
.card{position:relative;border:1.5px solid var(--line);border-radius:22px;box-shadow:0 6px 18px rgba(180,88,102,.07)}
.card:has(> .thead)::after{content:"";position:absolute;top:-16px;right:22px;width:52px;height:36px;background:var(--deco) center/contain no-repeat;transform:rotate(8deg);pointer-events:none}
.tag{border-radius:99px;background:var(--pri-l);color:var(--pri);font-weight:600;letter-spacing:.05em}
.tag.gen{background:var(--acc-l);color:var(--acc)}
.tchips button{border-radius:99px;border-color:var(--line);font-weight:500}
.tchips button[aria-pressed=true]{background:var(--pri);border-color:var(--pri)}
.cats button{border-radius:99px}
.cats button[aria-pressed=true]{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.q{border-radius:18px;border-color:var(--line);background:#fff}
.qn{background:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.qtools button,.timer{border-radius:99px;border-color:var(--line)}
.qtools button[aria-expanded=true]{background:var(--pri-l);border-color:var(--pri);color:var(--pri)}
.ver button[aria-pressed=true]{background:var(--acc);border-color:var(--acc)}
.hint{border-radius:14px;background:var(--chip)}
.sample{background:#fff6ee;border-left-color:#e3a7af;border-radius:14px}
mark{background:#f9d3d8}
.vc{border-radius:16px;border-color:var(--line)}
.vc .v{color:var(--acc)}
.gcat{border-radius:20px;border-top-color:#e3a7af}
.gcat h4{color:var(--acc)}
.cue{border:2px dashed var(--pri);border-radius:18px;background:#fff}
.opt{border-radius:16px}
.opt:hover:not(:disabled){border-color:var(--pri)}
.qbar i{background:linear-gradient(90deg,#e3a7af,var(--pri))}
.big{color:var(--pri)}
.fw{border-radius:99px;background:var(--acc-l);color:var(--acc)}
select{border-radius:99px}
.steps span.l{border-radius:50%}
/* ---------- theme: PRINCE ---------- */
html[data-theme=prince]{
  --bg:#f2f5fc; --card:#fdfdff; --ink:#1f2a44; --soft:#59648a; --line:#d5ddf0; --chip:#edf1fa;
  --pri:#2f4a8a; --pri-l:#e2e9f8; --acc:#8a6418; --acc-l:#f8efd6;
  --a1:#2f4a8a; --a2:#2f7a8c; --a3:#a8741a; --a4:#6a4fa0; --dot:#dbe3f4;
}
html[data-theme=prince] body{background-image:radial-gradient(circle,var(--dot) 1.8px,transparent 2.4px),radial-gradient(circle,#ead9ad 1.4px,transparent 2px);background-size:30px 30px,30px 30px;background-position:0 0,15px 15px}
html[data-theme=prince] .sample{background:#fdf8ea;border-left-color:#d9b65c}
html[data-theme=prince] mark{background:#f4e3b5}
html[data-theme=prince] .gcat{border-top-color:#d9b65c}
html[data-theme=prince] .card{box-shadow:0 6px 18px rgba(47,74,138,.08)}
/* ---------- theme: MANGA ---------- */
html[data-theme=manga]{
  --bg:#fbfbfb; --card:#fff; --ink:#111; --soft:#444; --line:#111; --chip:#f2f2f2;
  --pri:#d81b5c; --pri-l:#ffe2ec; --acc:#111; --acc-l:#fff3a6;
  --a1:#d81b5c; --a2:#1f5fd1; --a3:#b85f00; --a4:#111; --dot:#d9d9d9;
}
html[data-theme=manga] body{background-image:radial-gradient(var(--dot) 1.6px,transparent 2px);background-size:12px 12px;background-position:0 0}
html[data-theme=manga] .card{border:2.5px solid #111;border-radius:6px;box-shadow:6px 6px 0 #111}
html[data-theme=manga] .q,html[data-theme=manga] .vc,html[data-theme=manga] .gcat,html[data-theme=manga] .opt,html[data-theme=manga] .cue{border:2px solid #111;border-radius:6px}
html[data-theme=manga] .btn{border-radius:6px;border:2px solid #111;box-shadow:3px 3px 0 #111}
html[data-theme=manga] .tchips button,html[data-theme=manga] .cats button,html[data-theme=manga] .qtools button,html[data-theme=manga] .timer,html[data-theme=manga] .ver button{border:2px solid #111;border-radius:6px}
html[data-theme=manga] .tag{background:#fff3a6;color:#111;border:1.5px solid #111;border-radius:4px}
html[data-theme=manga] .hint{background:#fff;border:1.5px dashed #111;border-radius:6px}
html[data-theme=manga] .sample{background:#fff;border-left:5px solid #111;border-radius:4px}
html[data-theme=manga] mark{background:#fff3a6}
html[data-theme=manga] header{box-shadow:0 3px 0 #111;background-image:none}
html[data-theme=manga] header h1{font-weight:700;color:#111;text-transform:uppercase;letter-spacing:.02em}
html[data-theme=manga] .gcat{border-top:6px solid #111}
html[data-theme=manga] .qn{box-shadow:none;border:2px solid #111}
/* theme switch + credit */
.themes{display:inline-flex;gap:4px;background:var(--chip);border-radius:99px;padding:3px}
.themes button{border:0;background:none;border-radius:99px;padding:4px 10px;font-weight:500;font-size:.88rem;color:var(--soft)}
.themes button[aria-pressed=true]{background:var(--card);color:var(--pri);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
html[data-theme=manga] .themes{border:2px solid #111;border-radius:6px}
html[data-theme=manga] .themes button{border-radius:4px}
.credit{display:inline-block;margin-left:4px;padding:0 8px;border-radius:99px;background:var(--pri-l);color:var(--pri);font-weight:600}
footer{position:relative;z-index:2;text-align:center;padding:10px 16px 28px;color:var(--soft);font-size:.9rem}
footer b{color:var(--pri)}
header{background-color:var(--card)}
@media (max-width:700px){header{position:static}.themes button{padding:3px 8px;font-size:.82rem}}
/* stickers */
.stk{position:fixed;z-index:1;pointer-events:none;width:74px;height:74px;opacity:.95;filter:drop-shadow(0 3px 0 rgba(143,94,74,.15))}
.stk svg{width:100%;height:100%}
.s1{left:calc(50% - 640px);top:180px;transform:rotate(-10deg)}
.s2{right:calc(50% - 640px);top:300px;transform:rotate(9deg)}
.s3{left:calc(50% - 630px);bottom:60px;transform:rotate(6deg)}
.s4{right:calc(50% - 630px);bottom:120px;transform:rotate(-8deg)}
@media (max-width:1300px){.stk{display:none}}
.mini{display:inline-block;width:56px;height:56px;vertical-align:middle}
.mini svg{width:100%;height:100%}
main{position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1><span>IELTS Speaking Forecast<small>Parts 1–3 · ideas, vocabulary &amp; quiz <span class="credit">Created by DT</span></small></span></h1>
    <div class="row"><div class="themes" role="group" aria-label="Choose a theme"><button type="button" data-theme-set="princess" aria-pressed="true">👸 Princess</button><button type="button" data-theme-set="prince" aria-pressed="false">🤴 Prince</button><button type="button" data-theme-set="manga" aria-pressed="false">💥 Manga</button></div><button class="btn acc" id="rand" type="button">🎲 Random question</button></div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" type="button" data-tab="topics" aria-selected="true">Part 1 topics</button>
    <button role="tab" type="button" data-tab="part2" aria-selected="false">Part 2</button>
    <button role="tab" type="button" data-tab="part3" aria-selected="false">Part 3</button>
    <button role="tab" type="button" data-tab="how" aria-selected="false">How to answer</button>
    <button role="tab" type="button" data-tab="general" aria-selected="false">General vocab</button>
    <button role="tab" type="button" data-tab="quiz" aria-selected="false">Quiz</button>
  </div>
</header>
<div class="stk s1" aria-hidden="true" data-stk="0"></div><div class="stk s2" aria-hidden="true" data-stk="1"></div><div class="stk s3" aria-hidden="true" data-stk="2"></div><div class="stk s4" aria-hidden="true" data-stk="3"></div>
<main>
  <section id="topics" role="tabpanel"></section>
  <section id="part2" role="tabpanel" hidden></section>
  <section id="part3" role="tabpanel" hidden></section>
  <section id="how" role="tabpanel" hidden></section>
  <section id="general" role="tabpanel" hidden></section>
  <section id="quiz" role="tabpanel" hidden></section>
</main>
<footer>Created by <b>DT</b> · IELTS Speaking Forecast practice</footer>
<script>
/* ================= FORECAST DATA =================
   Question format: f:"A" = AREA  -> h:[Answer, Reason, Example, Alternative]
                    f:"W" = 5W2H  -> h:[[label, idea], ...]
   Vocab: [english, vietnamese, example sentence containing the phrase]           */
const GENERAL = [
  { cat: "Liking (thích)", items: [
    ["be into","thích, mê","I’m really into music, especially K-pop."],
    ["be a big fan of","là fan cuồng của, rất thích","I’m a big fan of street food."],
    ["be keen on","hứng thú với","I’m quite keen on reading comics."],
    ["can’t get enough of","mê mãi không chán","I can’t get enough of mango in summer."] ]},
  { cat: "Disliking (không thích)", items: [
    ["not my cup of tea","không phải gu của tôi","Horror films are not my cup of tea."],
    ["can’t stand","không chịu nổi","I can’t stand waiting in long queues."],
    ["not really into","không mặn mà lắm với","I’m not really into sports."] ]},
  { cat: "Frequency (tần suất)", items: [
    ["on a daily basis","hằng ngày","I use my laptop on a daily basis."],
    ["every now and then","thỉnh thoảng","Every now and then, I visit a night market."],
    ["once in a blue moon","rất hiếm khi","I write letters once in a blue moon."],
    ["most of the time","phần lớn thời gian","Most of the time, I study at home."] ]},
  { cat: "Giving reasons (nêu lý do)", items: [
    ["mainly because","chủ yếu là vì","I like it mainly because it’s cheap."],
    ["the main reason is that","lý do chính là","The main reason is that I don’t have much free time."],
    ["what I like most is","điều tôi thích nhất là","What I like most is the lively atmosphere."],
    ["it helps me to","nó giúp tôi","Music helps me to relax after school."] ]},
  { cat: "Feelings (cảm xúc)", items: [
    ["stressed out","căng thẳng","I feel stressed out before exams."],
    ["over the moon","vui sướng tột độ","I was over the moon when I found my phone."],
    ["a great way to unwind","cách tuyệt vời để thư giãn","Walking in the park is a great way to unwind."],
    ["feel nostalgic","thấy hoài niệm","Old photos make me feel nostalgic."] ]},
  { cat: "Past & childhood (quá khứ)", items: [
    ["when I was a kid","hồi còn nhỏ","When I was a kid, I loved paper planes."],

    { q:"Do you have a friend you have known for a long time?", f:"W", l:"Yes", alt:{ l:"No", f:"A", h:["Not really","My family moved house several times","I made new friends at every school","I still keep in touch with a few old classmates online"], s:"Not really, because my family moved house several times, so I had to make new friends at every school. I still keep in touch with a few old classmates online, though." },
      h:[["Who?","my best friend Lan"],["How long?","since we were six"],["Where did you meet?","in primary school / same neighbourhood"],["What do you do?","study together, share secrets"],["Why still friends?","we have a lot in common, through thick and thin"]],
      s:"Yes, my best friend Lan. We’ve known each other since we were six, because we lived on the same street. We’ve been through thick and thin together, and even though we go to different schools now, we still catch up every weekend." }

/* ---------- Part 2: Describe a person (1–6) ---------- */
PART2.push(
{ cat:"person", id:"metonce", name:"Met once, want to know more", title:"Describe a person you only met once recently and want to know more about",
  bullets:["who he/she is","when you met him/her","why you want to know more about him/her"], ending:"and explain how you feel about him/her.",
  f:"S", link:"",
  outline:[["Setting","last month, a book fair in Hanoi"],["Who","a young writer, early twenties, gave a short talk"],["What happened","she talked about travelling alone across Vietnam; we chatted for 10 minutes"],["Best moment","she signed my book and gave me writing advice"],["Why know more","adventurous, independent, she writes travel blogs"],["Feelings now","inspired, curious; I follow her social media"]],
  vocab:[
    ["strike up a conversation","bắt chuyện","I struck up a conversation with her at the book fair."],
    ["make a good first impression","gây ấn tượng tốt ban đầu","She made a good first impression on everyone."],
    ["down-to-earth","giản dị, gần gũi","Although she is famous, she is very down-to-earth."],
    ["adventurous","thích phiêu lưu","She is adventurous and loves travelling alone."],
    ["inspiring","truyền cảm hứng","Her story was really inspiring."],
    ["have a lot in common","có nhiều điểm chung","We have a lot in common, like reading and travelling."],
    ["keep in touch","giữ liên lạc","I hope we can keep in touch online."],
    ["out of curiosity","vì tò mò","Out of curiosity, I asked about her trips."]
  ],
  s:"I’d like to talk about a young writer I met at a book fair in Hanoi last month. I went there with my friend just to buy some cheap books, but there was a short talk by a travel writer in her early twenties, so we decided to listen. She talked about travelling alone across Vietnam by motorbike, which sounded incredibly adventurous. After the talk, I lined up to get her book signed, and we struck up a conversation for about ten minutes. Out of curiosity, I asked her how she managed to stay safe, and she gave me some practical advice about planning trips. She was surprisingly down-to-earth and made a really good first impression on me. The reason I want to know more about her is that we seem to have a lot in common – we both love reading and dream of exploring new places. I’d love to hear more about her experiences and maybe get some tips on writing. Overall, she was very inspiring, and I now follow her on social media, hoping we can keep in touch one day.",
  p3:[
    { q:"What can we do to leave a good impression on people we meet for the first time?", h:["Be friendly, polite and a good listener","People remember how you made them feel","At my school club, a new member who asked questions and smiled was liked immediately","So small things like eye contact and a smile matter a lot"],
      s:"I think the most important things are being friendly and being a good listener. People remember how you made them feel more than what you said. For example, when a new member joined my English club, she smiled, asked everyone questions and remembered our names – within a week, everyone liked her. So small things like eye contact and a smile can make a huge difference." },
    { q:"What should we not talk about when we meet a person for the first time?", h:["Avoid personal or sensitive topics","They can make people uncomfortable","Asking about salary, weight or age – my aunt was asked how much she earned and felt embarrassed","Stick to safe topics like hobbies, food or travel"],
      s:"We should avoid personal or sensitive topics, because they can make people feel uncomfortable. In Vietnam, people sometimes ask about salary or weight very directly. My aunt once met someone who asked how much she earned, and she felt really embarrassed. It’s much safer to talk about hobbies, food or travel." },
    { q:"How do people make friends in Vietnam?", h:["Mainly through school, work and neighbours","People spend most of their time in these places","I met most of my friends in class or in my neighbourhood; my parents’ friends are colleagues","Nowadays social media and clubs are also common"],
      s:"Most people make friends through school, work or their neighbourhood, simply because they spend most of their time there. For instance, almost all of my friends are classmates or kids who live on my street, and my parents’ closest friends are their colleagues. These days, though, many young people also make friends through online groups and clubs." },
    { q:"On what occasions do people like to make friends?", h:["When they start something new","They feel lonely and want support","On the first day of high school, everyone tried to find someone to sit with","Also at clubs, trips and parties"],
      s:"People usually want to make friends when they start something new, like a new school or a new job, because they feel a bit lonely and need support. I remember my first day of high school – everyone was looking for someone to sit with at lunch. Trips, clubs and parties are also great occasions, since people are relaxed and open." },
    { q:"Is it important to have the same hobbies and interests when making friends?", h:["Helpful, but not essential","Shared hobbies give you something to talk about","My best friend loves sport and I love books, but we share values like honesty","Values and personality matter more"],
      s:"It’s helpful, but I don’t think it’s essential. Shared hobbies give you something to talk about at the beginning. However, my best friend is crazy about football while I prefer reading, and we still get on really well because we share the same values, like honesty and kindness. In the long run, personality matters more." },
    { q:"What qualities make true friends?", h:["Loyalty, honesty and support","True friends are there through thick and thin","When I failed a test, my friend spent a whole weekend helping me revise","A true friend also tells you the truth, even when it’s hard"],
      s:"I’d say loyalty, honesty and being supportive. True friends stay with you through thick and thin. For example, when I failed a maths test last year, my best friend gave up her weekend to help me revise, and I passed the next one. A true friend also tells you the truth, even when it’s not what you want to hear." }
  ]},
{ cat:"person", id:"fitness", name:"Helped improve health", title:"Describe a person whose health and fitness you have helped to improve",
  bullets:["who this person was","why you helped him/her","how you helped him/her"], ending:"and explain whether it was easy or difficult.",
  f:"T", link:"",
  outline:[["Who","my dad, 48, office worker"],["Before","sat all day, gained weight, back pain, high blood pressure"],["At first","I suggested an evening walk together"],["Then","jogging 3 times a week, I made a healthy meal plan with mum"],["After 3 months","lost 6 kg, sleeps better, no back pain"],["Easy or difficult","difficult at first – he was lazy, but got easier"]],
  vocab:[
    ["sedentary lifestyle","lối sống ít vận động","Office workers often have a sedentary lifestyle."],
    ["put on weight","tăng cân","My dad put on weight after he got a desk job."],
    ["get into shape","lấy lại vóc dáng","He wanted to get into shape before Tết."],
    ["work out","tập thể dục","We work out together three times a week."],
    ["cut down on","cắt giảm","He cut down on sugary drinks."],
    ["stick to","kiên trì, bám theo (kế hoạch)","It was hard to stick to the plan."],
    ["keep him motivated","giữ động lực cho ông ấy","I kept him motivated with a step challenge."],
    ["pay off","được đền đáp","All our hard work finally paid off."]
  ],
  s:"The person I’d like to talk about is my dad. He’s 48 and works in an office, so he has a very sedentary lifestyle. A couple of years ago, he started to put on weight and often complained about back pain, and the doctor said his blood pressure was a bit high. I was worried about him, so I decided to help. At first, I simply suggested that we go for a walk around the lake after dinner. After a few weeks, we started jogging three times a week, and I downloaded an app to track his steps. I also worked with my mum to cut down on fried food and sugary drinks at home. To keep him motivated, we had a family step challenge, and the loser had to wash the dishes. Honestly, it was quite difficult at the beginning, because he was often tired after work and wanted to skip our runs. But after about three months, our hard work paid off: he lost six kilos, slept better and his back pain disappeared. I feel really proud that I helped him get into shape.",
  p3:[
    { q:"Which group pays more attention to health, young people or old people?", h:["Older people","They have more health problems and feel the risks","My grandparents check their blood pressure every morning and walk in the park at 5 a.m.","Young people care more about appearance than health"],
      s:"I think older people pay more attention to their health, mainly because they start to have health problems and feel the risks more clearly. My grandparents, for example, check their blood pressure every morning and walk in the park at five a.m. Young people, on the other hand, often stay up late and eat junk food; they care more about how they look than about their health." },
    { q:"What effect does stress have on health?", h:["Very negative effects on both body and mind","Stress affects sleep, eating and the immune system","Before my exams I couldn’t sleep, got headaches and caught a cold","Long-term stress can lead to serious illnesses"],
      s:"Stress has a really negative effect on both the body and the mind. It affects our sleep, our appetite and even our immune system. For instance, in the week before my final exams, I couldn’t sleep properly, had headaches every day and then caught a bad cold. If stress lasts for a long time, it can lead to serious problems like heart disease or depression." }
  ]},
{ cat:"person", id:"skill", name:"Taught you a new skill", title:"Describe a person who taught you a new skill",
  bullets:["who this person was","what the skill was","how you learned it"], ending:"and explain how you felt about this person.",
  f:"T", link:"",
  outline:[["Who","my uncle Tuan, a chef"],["Skill","cooking – making phở and spring rolls"],["Before","I couldn’t even fry an egg"],["Step by step","watched him first, then chopped vegetables, then cooked with him every Sunday for 2 months"],["Challenges","burned myself, too salty broth – trial and error"],["Feelings","grateful, he was patient; now I cook for my family"]],
  vocab:[
    ["pick up a skill","học được kỹ năng","I picked up cooking from my uncle."],
    ["patient","kiên nhẫn","He was patient with my mistakes."],
    ["step by step","từng bước một","He taught me step by step."],
    ["hands-on","thực hành trực tiếp","It was a hands-on lesson in the kitchen."],
    ["trial and error","thử và sai","I learned through trial and error."],
    ["get the hang of","nắm được cách làm","After a month, I got the hang of it."],
    ["give tips","đưa ra mẹo","He gave me tips to make the broth clearer."],
    ["grateful","biết ơn","I’m really grateful to him."]
  ],
  s:"I’d like to talk about my uncle Tuan, who taught me how to cook. He works as a chef in a restaurant in Hanoi, and he’s one of the most patient people I know. Two summers ago, I realised I couldn’t even fry an egg properly, which was a bit embarrassing, so I asked him to teach me. He taught me step by step. First, I just watched him and took notes. Then he let me chop vegetables and prepare the herbs. After that, every Sunday for about two months, we cooked a full meal together, like phở or spring rolls. It was very hands-on, and of course I learned a lot through trial and error – once I made the broth so salty that nobody could eat it! But he never got angry; he just laughed and gave me tips to fix it. By the end of the summer, I had finally got the hang of it. I feel really grateful to him, not only for the skill, but also because he showed me that making mistakes is part of learning. Now I often cook dinner for my family.",
  p3:[
    { q:"Why should children learn new skills?", h:["To build confidence and independence","Skills prepare them for real life","My cousin learned to swim at 7 and became much more confident","Also helps them find their interests early"],
      s:"Children should learn new skills because skills build confidence and independence, and prepare them for real life. For example, my cousin learned to swim when he was seven; before that he was shy, but afterwards he became much more confident in other activities too. Learning different skills also helps children discover what they’re really interested in." },
    { q:"Where can children learn new skills?", h:["At school, at home, at clubs and online","Each place teaches different skills","I learned cooking at home, football at a club and coding from YouTube","Parents should choose safe, suitable places"],
      s:"Children can learn new skills almost anywhere – at school, at home, at clubs or even online. Each place offers something different. Personally, I learned to cook at home, to play football at a local club and to do basic coding from YouTube videos. The key is that parents choose places that are safe and suitable for their child’s age." },
    { q:"How can parents and teachers teach children new skills?", h:["Be patient and make it hands-on and fun","Children learn best by doing","My primary teacher taught us fractions by cutting pizzas","Give praise to keep them motivated"],
      s:"I think they should be patient and make learning hands-on and fun, because children learn best by doing. My primary school teacher, for instance, taught us fractions by cutting paper pizzas, and I still remember it. It’s also important to praise children’s effort, so they stay motivated even when they make mistakes." },
    { q:"How do adults learn a new skill?", h:["Through online courses, practice and asking others","Adults have less time, so they learn flexibly","My mum learned to use Excel from YouTube in the evenings","They often learn because of work needs"],
      s:"Adults usually learn new skills through online courses, practice and asking colleagues, because they don’t have much free time. For example, my mum learned to use Excel by watching YouTube tutorials in the evenings after work. Most adults learn a skill because they need it for their job, so they’re very focused." },
    { q:"What are the differences between learning from a teacher and learning by oneself?", h:["A teacher gives guidance; self-study gives freedom","Teachers correct mistakes quickly; self-learners choose their own pace","I learned guitar alone and developed bad habits; my teacher fixed them","The best way is a mix of both"],
      s:"The main difference is that a teacher gives you guidance and corrects your mistakes quickly, while learning by yourself gives you more freedom to choose your pace. For instance, I taught myself guitar at first and developed some bad habits, which my teacher later had to fix. So I think a combination of both is the most effective." },
    { q:"Why is self-discipline important when learning a new skill?", h:["Because progress needs regular practice","Motivation disappears after the first few weeks","I gave up piano because I didn’t practise every day","With discipline, small daily practice adds up"],
      s:"Self-discipline is crucial because any skill needs regular practice, and motivation usually disappears after a few weeks. I gave up learning the piano when I was ten, simply because I didn’t practise every day. On the other hand, my friend practised English for twenty minutes daily and improved amazingly. Small daily efforts really add up." }
  ]},
{ cat:"person", id:"history", name:"Loves history", title:"Describe a person who learns history and loves history",
  bullets:["who this person is","how he/she learns history","why he/she loves history"], ending:"and explain how you feel about him/her.",
  f:"W", link:"",
  outline:[["Who","my classmate Minh, 16"],["How he learns","reads books, watches documentaries, visits museums and historical sites"],["Example","took me to the Temple of Literature and explained everything"],["Why he loves it","history is like real stories; helps him understand the present"],["Feelings","impressed, he made me like history more"]],
  vocab:[
    ["history buff","người mê lịch sử","Minh is a real history buff."],
    ["historical site","di tích lịch sử","We visited a historical site in Hue."],
    ["documentary","phim tài liệu","He watches history documentaries every night."],
    ["dynasty","triều đại","He knows every Vietnamese dynasty."],
    ["bring history to life","làm lịch sử trở nên sống động","He brings history to life with his stories."],
    ["have a passion for","có niềm đam mê với","He has a passion for ancient history."],
    ["knowledgeable","hiểu biết rộng","He is extremely knowledgeable."],
    ["learn from the past","học hỏi từ quá khứ","We can learn from the past to avoid mistakes."]
  ],
  s:"I’d like to describe my classmate Minh, who is a real history buff. He’s sixteen, quite quiet in class, but as soon as someone mentions history, his eyes light up. Minh learns history in many different ways. He reads lots of books, especially about Vietnamese dynasties, and he watches documentaries on YouTube almost every night. He also loves visiting historical sites. Last year, he took a group of us to the Temple of Literature and explained the story behind every building, which brought history to life for me. As for why he loves history, he says it’s like reading real stories about real people, and it helps him understand why our country is the way it is today. He also believes we can learn from the past to avoid making the same mistakes. Honestly, I really admire him. He’s extremely knowledgeable, but never shows off. Before I knew him, I thought history was just about memorising dates, but thanks to his passion, I now find it much more interesting.",
  p3:[
    { q:"Do you think children should begin learning history from an early age?", h:["Yes, but in a simple, fun way","It helps them understand their roots and culture","My grandmother told me stories about Hai Ba Trung when I was five, and I loved them","Dates and details can come later"],
      s:"Yes, I think so, but it should be taught in a simple, fun way. Learning history early helps children understand their roots and culture. For example, when I was five, my grandmother told me stories about the Trung Sisters, and I loved them. Dates and details can come later, when children are older." },
    { q:"At what age do you think people should begin to learn history?", h:["Around six or seven, when they start school","They can understand simple stories by then","My little brother, 7, enjoys picture books about famous heroes","Serious history at secondary school"],
      s:"I’d say around six or seven, when children start primary school, because by then they can understand simple stories. My seven-year-old brother, for instance, loves picture books about national heroes. More serious history, with causes and effects, should start at secondary school." },
    { q:"How do children learn history before they attend school?", h:["Through stories, films and holidays","Families pass on history naturally","Grandparents tell stories; on Independence Day kids watch parades on TV","These experiences make history feel personal"],
      s:"Mainly through stories, cartoons and festivals. Families pass on history quite naturally. In Vietnam, grandparents often tell children folk tales and stories about heroes, and on Independence Day kids watch parades on TV and ask questions. These experiences make history feel personal before they even start school." },
    { q:"Is it important to learn how people in the past lived their lives?", h:["Yes, very important","It helps us appreciate what we have now","When I visited an old village and saw how hard farmers worked without electricity, I stopped complaining","It also helps us keep traditions alive"],
      s:"Yes, I think it’s very important, because it helps us appreciate what we have today. When I visited an old village near Hanoi and learned how people farmed without machines or electricity, I realised how lucky I am. Learning about daily life in the past also helps us keep traditions alive." },
    { q:"Do you think people should learn ancient history before learning modern history?", h:["Generally yes – it follows the order of events","Modern events are easier to understand if you know the background","You can’t understand the Vietnam War without knowing about colonial times","But modern history may be more relevant for older students"],
      s:"Generally, yes, because history is a chain of events, and modern events make more sense if you know the background. For example, it’s hard to understand the wars of the twentieth century without knowing about the colonial period before them. However, for older students, modern history may feel more relevant to their lives." },
    { q:"Besides big historical events, what else is important when learning history?", h:["Ordinary people’s lives, culture and food","They show how society really worked","Learning about old markets, clothes and festivals in my local museum was fascinating","This makes history more human"],
      s:"I think ordinary people’s lives are just as important – things like food, clothes, jobs and festivals. They show how society really worked. For instance, the local museum in my city has a section on old markets and traditional clothes, which I found far more fascinating than the lists of battles. It makes history feel much more human." }
  ]},
{ cat:"person", id:"handmade", name:"Good at making things by hand", title:"Describe a person who is good at making things by hand",
  bullets:["who this person is","what he/she makes","what materials or technologies he/she uses"], ending:"and why you think this person is good at making things by hand.",
  f:"W", link:"",
  outline:[["Who","my grandfather, retired carpenter, 70"],["What he makes","wooden toys, small chairs, bird cages"],["Materials / tools","bamboo, wood, hand saw, sandpaper, glue"],["Example","made me a wooden car for my 8th birthday"],["Why good","decades of experience, patient, creative, careful"],["Feelings","proud, I keep his gifts"]],
  vocab:[
    ["skilful","khéo léo","My grandfather is very skilful with his hands."],
    ["handmade","làm thủ công","Handmade toys are special."],
    ["carpenter","thợ mộc","He was a carpenter for forty years."],
    ["craftsmanship","tay nghề thủ công","His craftsmanship is amazing."],
    ["pay attention to detail","chú ý đến chi tiết","He pays attention to every small detail."],
    ["creative","sáng tạo","He is creative and has lots of ideas."],
    ["one of a kind","độc nhất vô nhị","Each toy is one of a kind."],
    ["take pride in","tự hào về","He takes pride in his work."]
  ],
  s:"The person I want to talk about is my grandfather. He’s seventy now, and he used to be a carpenter for over forty years, so he’s incredibly skilful with his hands. Even after retiring, he spends most mornings in a small workshop behind his house. He makes all kinds of things, like wooden toys, small chairs and bird cages. He mainly uses wood and bamboo, and very simple tools such as a hand saw, a knife, sandpaper and glue – he doesn’t use any modern machines. For my eighth birthday, he made me a wooden toy car with wheels that actually turned, and I still keep it on my shelf. I think he’s so good at making things because of his long experience, but also because he’s extremely patient and pays attention to every small detail. He can spend a whole day just sanding one piece of wood until it’s perfectly smooth. Everything he makes is one of a kind, and he really takes pride in his craftsmanship. I feel very proud of him, and I hope to learn some of his skills one day.",
  p3:[
    { q:"Do you think art classes are important for children?", h:["Yes, very important","They develop creativity and help children relax","My shy cousin became more confident after drawing class","Schools shouldn’t focus only on academic subjects"],
      s:"Yes, I think they’re very important, because art develops creativity and gives children a way to express themselves and relax. My cousin, for example, was extremely shy, but after a year of drawing classes, she became much more confident. Schools shouldn’t focus only on maths and science." },
    { q:"Why do some children enjoy making things by hand?", h:["They like creating something real","It’s satisfying and fun to show others","My brother is proud of his Lego models and shows them to every visitor","It’s also a break from screens"],
      s:"I think children enjoy it because they can create something real that they can touch and show to others. It’s very satisfying. My younger brother, for instance, spends hours building Lego models and proudly shows them to every visitor. Making things by hand is also a nice break from screens." },
    { q:"Do children these days still like doing arts and crafts?", h:["Yes, but less than before","They spend more time on phones and games","My brother prefers games, but he still loves making Tết decorations at school","Schools and parents need to encourage it"],
      s:"Yes, but probably less than before, because they spend so much time on phones and video games. My brother, for example, would rather play games, but he still gets excited when his school makes decorations for Tết. So I think children still enjoy crafts if parents and schools encourage them." },
    { q:"What impact can artistic buildings have on society?", h:["Very positive – they attract tourists and create pride","They become symbols of a city","Hanoi Opera House is a symbol of the city and attracts thousands of visitors","They also make cities nicer places to live"],
      s:"Artistic buildings can have a very positive impact. They often become symbols of a city and make people proud of where they live. A good example is Hanoi Opera House, which attracts thousands of tourists and is a popular spot for wedding photos. Beautiful buildings also make cities more pleasant to live in." },
    { q:"Is it good to have creative people in a team?", h:["Yes, definitely","They bring new ideas and solve problems differently","In our school project, a creative classmate designed a video that won first prize","But a team also needs organised people"],
      s:"Yes, definitely, because creative people bring fresh ideas and solve problems in different ways. In our last school project, one creative classmate suggested making a short video instead of slides, and we won first prize. However, a team also needs organised people to make sure the ideas actually get done." },
    { q:"Does art, like music or theater, have an impact on society?", h:["Yes, a big impact","It spreads messages and brings people together","Songs about protecting the environment made young people more aware","It also preserves culture, like traditional water puppetry"],
      s:"Yes, I think art has a big impact, because it can spread messages and bring people together. For example, some Vietnamese songs about protecting the environment have made young people more aware of the problem. Art like traditional water puppetry also helps to preserve our culture." }
  ]},
{ cat:"person", id:"photos", name:"Likes taking photos", title:"Describe a person you know who really likes taking photos",
  bullets:["who the person is","when and how you got to know him/her","where he/she takes photos"], ending:"and explain how you feel about him/her.",
  f:"W", link:"",
  outline:[["Who","my cousin Linh, 20, university student"],["When / how met","family member – grew up together, closer since she joined a photo club"],["Where","old streets in Hanoi, sunsets at West Lake, on trips"],["How","old film camera + phone, gets up early for good light"],["Feelings","admire her eye for detail; she inspired me to take better photos"]],
  vocab:[
    ["capture the moment","ghi lại khoảnh khắc","She always captures the moment perfectly."],
    ["have an eye for detail","có con mắt tinh tế với chi tiết","She has an eye for detail."],
    ["natural light","ánh sáng tự nhiên","She prefers natural light to flash."],
    ["scenery","phong cảnh","The scenery in Sa Pa is stunning."],
    ["candid photos","ảnh chụp tự nhiên, không tạo dáng","She likes candid photos of people."],
    ["edit photos","chỉnh sửa ảnh","She edits photos on her laptop."],
    ["stunning","tuyệt đẹp","Her photos of the sunset are stunning."],
    ["be passionate about","đam mê","She’s passionate about photography."]
  ],
  s:"I’d like to talk about my cousin Linh, who is twenty and studies at a university in Hanoi. We grew up together, so I’ve known her all my life, but we became much closer about two years ago when she joined a photography club and started taking me along on her photo walks. Linh is really passionate about photography. She has an old film camera that belonged to her grandfather, but she also uses her phone. She loves taking photos of old streets in the Old Quarter, especially candid photos of street vendors, and she often gets up at five a.m. to catch the soft natural light. At weekends she goes to West Lake to capture the sunset, and whenever she travels, she comes back with hundreds of stunning pictures of the scenery. What I admire most is that she has an eye for detail – she notices things that most people walk past, like a cat sleeping on a motorbike. I feel inspired by her, and thanks to her tips, my own photos have improved a lot.",
  p3:[
    { q:"Why are some people keen on taking photos?", h:["To keep memories and express themselves","Photos last longer than memory","My mum takes photos of every family meal to look back on later","Some also want to share on social media"],
      s:"I think most people take photos to keep memories, because our memory fades but photos last. My mum, for instance, takes pictures of almost every family meal so that she can look back on them later. Others see photography as a way to express their creativity, and of course many want to share their lives on social media." },
    { q:"What kind of photos do people often take?", h:["Selfies, food and travel photos","These are easy to share and show their lifestyle","My friends always photograph their bubble tea before drinking","Older people prefer family photos"],
      s:"Young people mostly take selfies, food photos and travel photos, because they’re easy to share and show their lifestyle. My friends, for example, never drink their bubble tea before taking a picture of it! Older people, on the other hand, tend to take family photos at special occasions like Tết or weddings." },
    { q:"Do you think it’s ok to take photos everywhere?", h:["No, not everywhere","Some places need respect or privacy","In pagodas and hospitals, or of strangers without asking","Always ask permission and follow the rules"],
      s:"No, I don’t think so. Some places need respect or privacy. For example, taking photos inside a pagoda during a ceremony or in a hospital can be very disrespectful. Taking pictures of strangers without asking is also rude. People should always follow the rules and ask permission first." },
    { q:"Why do tourists like taking photos while they are travelling?", h:["To remember and share their trips","Travel is special and doesn’t happen often","When my family went to Ha Long Bay, we took over 500 photos in two days","Photos also prove they’ve been somewhere"],
      s:"Tourists take lots of photos because travel is special and doesn’t happen very often, so they want to remember every moment and share it with friends. When my family went to Ha Long Bay, we took over five hundred photos in just two days! For some people, photos are also a way to show that they’ve been somewhere famous." },
    { q:"Some people don’t mind others walking into their shot when they’re taking photos. What do you think?", h:["They are relaxed and polite","In public places, it’s hard to have an empty shot","At Hoan Kiem Lake on weekends, hundreds of people walk past","But others should still try to wait or walk around"],
      s:"I think those people are quite relaxed and realistic, because in busy public places it’s almost impossible to get an empty shot. At Hoan Kiem Lake on weekends, for example, hundreds of people walk past every minute. Still, I believe passers-by should be considerate and wait a second or walk around if they can." }
  ]}
);

{ cat:"person", id:"organised", name:"Very organised", title:"Describe a person you know who is very organized",
  bullets:["who this person is","what this person usually does to stay organized","in what situations you have noticed this quality"], ending:"and explain why you think being organized is important to him/her.",
  f:"W", link:"",
  outline:[["Who","my mum, accountant"],["What she does","to-do lists, a planner, everything has its place, plans meals for the week"],["Situations","Tết preparations, our family trip, when I was sick"],["Example","planned our Da Nang trip down to the minute, packed a first-aid kit"],["Why important to her","busy job + family; saves time and reduces stress"]],
  vocab:[
    ["well-organised","ngăn nắp, có tổ chức","My mum is extremely well-organised."],
    ["to-do list","danh sách việc cần làm","She writes a to-do list every morning."],
    ["plan ahead","lên kế hoạch trước","She always plans ahead."],
    ["keep track of","theo dõi, nắm được","She keeps track of all our appointments."],
    ["prioritise","sắp xếp thứ tự ưu tiên","She knows how to prioritise tasks."],
    ["juggle","xoay xở cùng lúc nhiều việc","She juggles a full-time job and housework."],
    ["meet deadlines","kịp hạn chót","She never misses a deadline."],
    ["stay on top of things","kiểm soát tốt mọi việc","Lists help her stay on top of things."]
  ],
  s:"The most organised person I know is definitely my mum. She’s an accountant, so she deals with numbers and deadlines all day, and she has to juggle a full-time job with looking after our family. To stay organised, she writes a to-do list every morning and keeps a paper planner where she keeps track of everyone’s appointments, from my dentist visits to my dad’s business trips. At home, everything has its place, and she plans our meals for the whole week every Sunday. I’ve noticed this quality in lots of situations. Before Tết, for example, she makes a detailed list of things to buy and clean, and somehow everything gets done on time. When we went to Da Nang last summer, she planned the trip almost down to the minute, and she even packed a small first-aid kit, which was really useful when my brother cut his foot on a rock. I think being organised is important to her because she has so many responsibilities. Planning ahead saves her time and helps her stay calm instead of feeling stressed. I really admire her for that.",
  p3:[
    { q:"Why is it important for people to be organized?", h:["It saves time and reduces stress","People know what to do and don’t forget things","Before exams, my organised friend made a revision plan and felt calm, while I panicked","It also makes people look reliable"],
      s:"Being organised saves time and reduces stress, because you always know what to do next and don’t forget important things. Before our last exams, for example, my friend made a detailed revision timetable and felt quite calm, while I panicked because I hadn’t planned anything. Organised people also seem more reliable to others." },
    { q:"Do you think children should learn to be organized from a young age?", h:["Yes, definitely","Habits formed early last a lifetime","My parents made me pack my school bag every night, and I still do it","Keep it simple and fun for kids"],
      s:"Yes, definitely, because habits formed early tend to last a lifetime. When I was in primary school, my parents made me pack my school bag every evening, and I still do it now without thinking. Of course, it should be simple and fun for young children, like using colourful stickers on a chart." },
    { q:"Are organized people more likely to be successful at work or in their studies?", h:["Generally yes","They meet deadlines and manage their time well","The top student in my class plans every week in a notebook","But creativity and hard work also matter"],
      s:"Generally, yes, because organised people meet deadlines and manage their time well. The top student in my class, for instance, plans every week in a notebook and never hands in homework late. However, organisation alone isn’t enough – creativity and hard work also play a big role in success." },
    { q:"What can people do to become more organized?", h:["Use lists, planners and apps","Writing things down frees your mind","I started using Google Calendar and stopped forgetting my extra classes","Start small, one habit at a time"],
      s:"People can start by using simple tools like to-do lists, planners or apps, because writing things down frees your mind. Last year I began using Google Calendar, and since then I haven’t missed a single extra class. The key is to start small and build one habit at a time." },
    { q:"Should parents teach their children to be organized?", h:["Yes, parents are the first teachers","Children copy what they see at home","My mum’s tidy habits rubbed off on me","Teachers can help too, but home is most important"],
      s:"Yes, I believe parents should, because they’re children’s first teachers and kids copy what they see at home. My mum is very tidy, and over time her habits rubbed off on me – now I can’t sleep if my desk is messy. Teachers can help too, but the home environment matters most." },
    { q:"Do you think it is important for managers to be well organized?", h:["Yes, extremely important","A manager affects the whole team","My dad’s old manager was disorganised; the team often worked late because of last-minute changes","Organised managers make plans clear and fair"],
      s:"Yes, it’s extremely important, because a manager’s habits affect the whole team. My dad once had a very disorganised manager who changed plans at the last minute, so the team often had to work late. An organised manager makes plans clear, shares tasks fairly and keeps everyone less stressed." }
  ]},
{ cat:"person", id:"happy", name:"A happy person", title:"Describe a happy person you know",
  bullets:["who this person is","what he/she is like","how he/she shows happiness"], ending:"and explain why you think he/she is a happy person.",
  f:"W", link:"",
  outline:[["Who","my grandmother, 75, lives in the countryside"],["What she is like","cheerful, kind, easy-going"],["How she shows it","always smiling, sings while cooking, tells jokes, helps neighbours"],["Example","even when she was ill, she joked with the nurses"],["Why happy","simple life, close family, grateful for small things"]],
  vocab:[
    ["cheerful","vui vẻ","She is always cheerful."],
    ["easy-going","dễ tính","My grandma is easy-going and relaxed."],
    ["optimistic","lạc quan","She is optimistic even in hard times."],
    ["a sense of humour","khiếu hài hước","She has a great sense of humour."],
    ["light up the room","làm bừng sáng căn phòng","Her smile lights up the room."],
    ["count your blessings","biết trân trọng những gì mình có","She always says, ‘Count your blessings.’"],
    ["content with","hài lòng với","She is content with a simple life."],
    ["positive energy","năng lượng tích cực","She gives everyone positive energy."]
  ],
  s:"The happiest person I know is my grandmother. She’s seventy-five and lives in a small village in Nam Dinh province. She’s cheerful, easy-going and incredibly kind, and her smile really lights up the room. She shows her happiness in many small ways. She’s always smiling, she sings old folk songs while she cooks, and she has a great sense of humour – she loves telling us funny stories about my dad when he was a naughty boy. She also enjoys helping her neighbours, for example by sharing vegetables from her garden. What impressed me most was last year when she was in hospital for a week. Even though she was ill, she still joked with the nurses and made everyone in the room laugh. I think she’s a happy person because she’s content with a simple life. She doesn’t need expensive things; she’s happy as long as her family is healthy and comes to visit. She always tells me to ‘count your blessings’, and she really lives by those words. Whenever I feel stressed, I call her, and her positive energy always cheers me up.",
  p3:[
    { q:"Should teachers know what children are doing all the time?", h:["Not all the time","Children need some freedom and privacy","My primary teacher let us play freely at break but watched for problems","Teachers should keep an eye out, not control everything"],
      s:"Not all the time, I think. Children need some freedom and privacy to grow up independent. My primary school teacher, for example, let us play freely at break time, but she always noticed if someone was being left out. So teachers should keep an eye on children without trying to control everything." },
    { q:"Do you think teachers are able to spot the unhappy children?", h:["Good teachers often can, but not always","Some children hide their feelings well","My form teacher noticed my friend was quiet and found out her parents were divorcing","Large classes make it harder"],
      s:"Good teachers often can, but not always, because some children are very good at hiding their feelings. My form teacher once noticed that my friend had become unusually quiet, talked to her privately and found out her parents were divorcing. But with forty-five students in a class, it’s very hard to notice everyone." },
    { q:"How can the arts spread positive emotions in society?", h:["Through music, films and festivals that bring people together","Art makes people laugh, feel hopeful and connected","During the pandemic, songs encouraging frontline workers went viral and lifted everyone’s spirits","Public art also makes cities brighter"],
      s:"The arts can spread positive emotions by bringing people together and making them feel hopeful. During the pandemic in Vietnam, for instance, several songs thanking doctors and frontline workers went viral, and they really lifted people’s spirits. Even colourful murals on city walls can make people smile on their way to work." },
    { q:"When do you think people are happiest?", h:["When they are with loved ones or achieve a goal","Happiness comes from connection and success","My family is happiest at Tết, when everyone is home","Also children on holidays, adults when they retire"],
      s:"I think people are happiest when they’re with their loved ones or when they achieve something important. For my family, the happiest time is definitely Tết, when everyone comes home and we eat together for days. Personally, I also felt extremely happy when I passed my high school entrance exam." }
  ]},
{ cat:"person", id:"famous", name:"Famous person in your area", title:"Describe a famous person in your local area",
  bullets:["who this person is","what he/she has done","why he/she is popular"], ending:"and explain how you feel about this person.",
  f:"W", link:"",
  outline:[["Who","Mrs Hoa, owner of a famous phở shop in my neighbourhood"],["What she has done","ran the shop for 30 years, gives free meals to poor students, featured on TV"],["Why popular","delicious food, kind-hearted, remembers everyone’s names"],["Example","during the pandemic, gave free phở to hospital workers"],["Feelings","respect, proud she’s from my area"]],
  vocab:[
    ["well-known","nổi tiếng","She is well-known in my neighbourhood."],
    ["kind-hearted","tốt bụng","She is very kind-hearted."],
    ["local celebrity","người nổi tiếng địa phương","She’s a local celebrity."],
    ["give back to the community","đóng góp lại cho cộng đồng","She gives back to the community."],
    ["be featured on","được đưa tin trên","Her shop was featured on TV."],
    ["word of mouth","truyền miệng","Her shop became famous by word of mouth."],
    ["look up to","ngưỡng mộ, kính trọng","Many young people look up to her."],
    ["a role model","tấm gương","She is a role model for me."]
  ],
  s:"I’d like to talk about Mrs Hoa, who is a local celebrity in my neighbourhood in Hanoi. She owns a small phở shop that has been open for about thirty years. Her shop became famous mainly by word of mouth, and a few years ago it was even featured on a TV food programme, so now there are always long queues, especially in the morning. But she’s not only famous for her food. She’s extremely kind-hearted and gives free meals to poor students who live in the area. During the pandemic, she cooked hundreds of bowls of phở for free and sent them to doctors and nurses at the local hospital, which made her even more popular. People also love her because she remembers almost everyone’s name and always chats with her customers, even when she’s very busy. Personally, I have a lot of respect for her. She shows that you don’t need to be rich or a big star to make a difference. She really gives back to the community, and many young people in my area, including me, look up to her as a role model.",
  p3:[
    { q:"Is it always good to be a popular student at school?", h:["Not always","Popularity brings pressure and distraction","A popular boy in my class spent so much time on social activities that his grades dropped","Being kind matters more than being popular"],
      s:"Not always. Popularity can bring a lot of pressure and distractions. For example, a very popular boy in my class was always busy with events and social media, and his grades dropped quite a lot. Some popular students also feel they must always look perfect. I think being kind and having a few true friends matters more." },
    { q:"Why are some students popular?", h:["They are friendly, funny or talented","People like being around positive, confident people","My classmate is popular because she’s funny and helps everyone with English","Good looks or sports skills also help"],
      s:"Usually because they’re friendly, funny or talented, and people naturally like being around confident, positive people. My classmate Mai, for instance, is popular because she makes everyone laugh and always helps others with English homework. Being good at sports or good-looking can also make students popular." }
  ]},
{ cat:"person", id:"difficult", name:"Did something difficult, succeeded", title:"Describe a person you know who did something difficult and was successful",
  bullets:["who this person is","what difficult thing this person did","why this person was successful"], ending:"and explain how you feel about this person.",
  f:"S", link:"",
  outline:[["Who","my aunt Thu, 40"],["Setting","lost her office job during the pandemic"],["Difficult thing","opened an online bakery with no business experience"],["Problems","little money, worked until midnight, many failed cakes"],["Success","now has 2 shops and 10 staff"],["Why successful / feelings","hard-working, never gave up, listened to customers; I admire her"]],
  vocab:[
    ["overcome difficulties","vượt qua khó khăn","She overcame many difficulties."],
    ["start from scratch","bắt đầu từ con số 0","She started her business from scratch."],
    ["determined","quyết tâm","She was determined to succeed."],
    ["take a risk","chấp nhận rủi ro","She took a big risk."],
    ["never give up","không bao giờ bỏ cuộc","She never gave up."],
    ["hard-working","chăm chỉ","She is the most hard-working person I know."],
    ["make ends meet","xoay xở đủ sống","At first, she could hardly make ends meet."],
    ["pay off","được đền đáp","Her hard work finally paid off."]
  ],
  s:"I’d like to talk about my aunt Thu, who is forty and lives in Hanoi. During the pandemic, she lost her office job, which was a huge shock because she had two children to support. Instead of waiting for another job, she decided to do something really difficult: she started an online bakery from scratch, even though she had no business experience at all. At the beginning, things were very hard. She had very little money, so she baked in her tiny kitchen and worked until midnight almost every day. Many cakes failed, and some months she could hardly make ends meet. But she was determined and never gave up. She watched baking videos, asked customers for feedback and kept improving her recipes. Slowly, her cakes became popular on Facebook through word of mouth. Now, four years later, she has two small shops and about ten staff. I think she was successful because she was hard-working, she took a risk at the right time and she really listened to her customers. I admire her a lot, and whenever I feel like giving up on something, I remember her story.",
  p3:[
    { q:"Other than making money, what is more important for a company?", h:["Treating staff and customers well","Happy staff and loyal customers keep a company alive","My aunt’s bakery gives staff training and bonuses, so nobody leaves","Also responsibility to society and the environment"],
      s:"Apart from making money, I think it’s important for a company to treat its staff and customers well, because happy employees and loyal customers keep a business going. My aunt’s bakery, for example, gives staff free training and Tết bonuses, so almost nobody has left in four years. Companies should also act responsibly towards society and the environment." },
    { q:"Is it easy to start up a company?", h:["Starting is easy, but surviving is hard","Registration is simple, but money and competition are big problems","My aunt registered quickly but almost ran out of money in year one","Most start-ups need several years to be stable"],
      s:"In some ways it’s easy, because registering a company is fairly simple nowadays. But keeping it alive is very hard, mainly because of money and competition. My aunt, for instance, set up her bakery in just a week, but she almost ran out of money in the first year. Most start-ups need several years before they become stable." },
    { q:"In which sectors are companies more likely to succeed in Vietnam?", h:["Food, e-commerce and technology","Vietnamese people love eating out and shopping online","Many coffee chains and online shops grew fast in recent years","Tourism also has great potential"],
      s:"I’d say food and drink, e-commerce and technology. Vietnamese people love eating out and shopping online, so these sectors grow quickly. For example, many coffee chains and online fashion shops have expanded very fast in the last few years. Tourism also has great potential because of our beautiful landscapes." },
    { q:"Is it difficult to do business in today’s world?", h:["Yes, quite difficult","Competition is global and trends change fast","Small shops near my house closed because people now buy on Shopee","But technology also offers new chances"],
      s:"Yes, it’s quite difficult, because competition is global and customer trends change very quickly. Several small clothes shops near my house have closed because people now prefer to shop on apps like Shopee. On the other hand, technology also gives businesses new opportunities, like selling online to the whole country." },
    { q:"How can companies help protect the environment?", h:["Reduce plastic, save energy, recycle","Companies produce a lot of waste","Some coffee shops in Hanoi give discounts if you bring your own cup","They can also use solar power"],
      s:"Companies can reduce plastic packaging, save energy and recycle their waste, since businesses produce a huge amount of rubbish. For instance, some coffee shops in Hanoi now give customers a discount if they bring their own cup, which cuts down on single-use plastic. Bigger companies could also install solar panels on their roofs." },
    { q:"Does money equal success?", h:["No, not completely","Success also means happiness, health and relationships","A rich businessman in my area works 14 hours a day and rarely sees his kids","Money is only one part of success"],
      s:"No, I don’t think so. Money is part of success, but success also includes happiness, health and good relationships. For example, there’s a rich businessman in my area who works fourteen hours a day and hardly ever sees his children – I wouldn’t call that a successful life. So money is just one piece of the puzzle." }
  ]},
{ cat:"person", id:"popular", name:"A popular person", title:"Describe a popular person",
  bullets:["who this person is","what kind of person he or she is","when you see him/her normally"], ending:"and explain why you think this person is popular.",
  f:"W", link:"",
  outline:[["Who","Mr Nam, my English teacher"],["What kind of person","funny, patient, enthusiastic, fair"],["When you see him","English lessons 4 times a week, English club on Friday"],["Example","uses songs and games, stays after class to help weak students"],["Why popular","makes learning fun, treats everyone equally, cares about students"]],
  vocab:[
    ["enthusiastic","nhiệt tình","He is an enthusiastic teacher."],
    ["approachable","dễ gần","He’s very approachable."],
    ["treat everyone equally","đối xử công bằng với mọi người","He treats everyone equally."],
    ["go the extra mile","nỗ lực hơn mức cần thiết","He always goes the extra mile for us."],
    ["make learning fun","làm việc học trở nên vui","He makes learning fun with games."],
    ["be well-liked","được yêu mến","He is well-liked by all students."],
    ["sense of humour","khiếu hài hước","He has a great sense of humour."],
    ["look forward to","mong chờ","We look forward to his lessons."]
  ],
  s:"The person I’d like to describe is Mr Nam, my English teacher, who is probably the most popular teacher in my school. He’s in his early thirties and has been teaching for about eight years. He’s funny, patient and extremely enthusiastic, and he’s also very approachable – we can ask him anything without feeling embarrassed. I see him four times a week in our English lessons, and also on Friday afternoons, because he runs the school’s English club. I think there are several reasons why he’s so well-liked. First, he makes learning fun. Instead of just following the textbook, he uses songs, games and short videos, so everyone looks forward to his lessons. Second, he treats everyone equally, whether they’re top students or weaker ones. Finally, he really goes the extra mile. For example, before our exams, he stayed after school for free to help students who were struggling. He also has a great sense of humour and remembers small things about us, like our hobbies. Because of him, I started to love English, and I hope I can be like him one day.",
  p3:[
    { q:"Why are some students popular in school?", h:["They are friendly, funny or talented","People enjoy being with them","The class monitor is popular because she organises fun events and helps everyone","Sometimes good looks or sports skills"],
      s:"Some students are popular because they’re friendly, funny or talented, so others enjoy spending time with them. In my class, for instance, our class monitor is very popular because she organises fun events and always helps people with homework. Being good at sports or singing can also make a student popular." },
    { q:"Is it important for a teacher to be popular?", h:["Not essential, but helpful","Students learn better when they like their teacher","I worked much harder in Mr Nam’s class because I liked him","But being effective matters more than being popular"],
      s:"It’s not essential, but it definitely helps, because students tend to learn better when they like their teacher. I worked much harder in English simply because I liked my teacher. However, a teacher’s main job is to help students learn, so being effective matters more than being popular." },
    { q:"Do you think good teachers are always popular among students?", h:["Not always","Good teachers can be strict","My maths teacher was strict and unpopular, but our results were the best in school","Students often appreciate them later"],
      s:"Not always. Some good teachers are strict and give lots of homework, which students don’t like at the time. My secondary school maths teacher, for example, wasn’t popular at all, but our class got the best results in the school. Students often only appreciate teachers like that years later." },
    { q:"What are the qualities of being a good teacher?", h:["Patience, knowledge and caring","Students learn at different speeds and need support","My teacher explained one grammar point five times without getting annoyed","Also making lessons interesting"],
      s:"I’d say a good teacher needs patience, solid knowledge and real care for students, because everyone learns at a different speed. My English teacher once explained the same grammar point five times to a classmate without getting annoyed at all. Making lessons interesting is also important to keep students motivated." },
    { q:"Is it easier to become popular nowadays?", h:["Yes, thanks to social media","Anyone can reach thousands of people","A girl from my school became famous on TikTok for cooking videos","But that popularity often doesn’t last"],
      s:"Yes, I think it’s much easier nowadays because of social media – anyone can reach thousands of people with one video. A girl from my school, for example, became well-known on TikTok for her simple cooking videos. However, this kind of popularity often disappears as quickly as it comes." },
    { q:"Why do people want to be popular?", h:["To feel accepted and valued","Humans need a sense of belonging","Teenagers count likes because they want approval from friends","Some also want fame for money or opportunities"],
      s:"Most people want to be popular because they want to feel accepted and valued – it’s a basic need to belong. Teenagers, for instance, often check how many likes their photos get because they want approval from their friends. Some people also want popularity for practical reasons, like getting business opportunities." }
  ]},
